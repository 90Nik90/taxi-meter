name: Android build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: |
          set -o pipefail
          gradle test assembleDebug -PbuildNumber=${{ github.run_number }} \
            --no-daemon --console=plain 2>&1 | tee build.log

      # Ошибки компилятора кладём в аннотацию запуска: полный лог доступен
      # только с токеном, а аннотации читаются через открытый API.
      - name: Report build errors
        if: failure()
        run: |
          MSG=$(grep -E '^e: |^w: |FAILURE:|What went wrong|Caused by:|Execution failed' build.log | head -60 || true)
          if [ -z "$MSG" ]; then MSG=$(tail -60 build.log); fi
          MSG="${MSG//'%'/'%25'}"
          MSG="${MSG//$'\n'/'%0A'}"
          MSG="${MSG//$'\r'/'%0D'}"
          echo "::error::$MSG"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: taximeter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Артефакты качаются только под логином и живут 90 дней. Релиз с
      # постоянным тегом latest даёт прямую ссылку, которая не меняется.
      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "Таксометр — свіжа збірка" \
            --notes "APK зібрано автоматично зі збірки ${{ github.run_number }}."
