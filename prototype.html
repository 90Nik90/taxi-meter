<title>Калькулятор таксиста</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    color-scheme: light;

    /* Фон страницы вокруг телефона */
    --page-bg: #ecebe6;

    /* Экран устройства: значения один-в-один из ui/theme/Theme.kt */
    --m-bg: #101418;
    --m-surface: #1b222b;
    --m-variant: #243040;
    --m-on: #e6eaf0;
    --m-dim: #b4bfce;
    --m-outline: #3a4757;
    --m-accent: #ffd426;
    --m-go: #2ecc71;
    --m-wait: #ffa726;
    --m-stop: #e74c3c;
    --m-gray: #6b7889;
    /* Безналичная оплата: отделяет карту от жёлтого фирменного цвета */
    --m-card: #3f9bf0;

    --shell: #04060a;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page-bg: #14181d;
      --shell: #000000;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --page-bg: #14181d;
    --shell: #000000;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--m-on);
    font-family: Roboto, "Segoe UI", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ─── Корпус телефона ────────────────────────────────────────── */

  .phone {
    width: 100%;
    max-width: 392px;
    background: var(--shell);
    border-radius: 34px;
    padding: 9px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, .32), 0 1px 0 rgba(255, 255, 255, .06) inset;
  }

  .screen {
    background: var(--m-bg);
    color: var(--m-on);
    border-radius: 26px;
    overflow: hidden;
    height: min(748px, calc(100dvh - 58px));
    min-height: 560px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 18px 3px;
    font-family: "Roboto Mono", monospace;
    font-size: 11px;
    color: var(--m-dim);
    flex: none;
  }

  .appbar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 6px 4px 8px;
    flex: none;
  }

  .appbar .t {
    flex: 1;
    font-size: 20px;
    font-weight: 500;
    padding-left: 8px;
  }

  .iconbtn {
    width: 44px;
    height: 44px;
    border: 0;
    background: none;
    border-radius: 50%;
    color: var(--m-on);
    display: grid;
    place-items: center;
    cursor: pointer;
    flex: none;
    padding: 0;
  }

  .iconbtn:hover { background: rgba(255, 255, 255, .07); }
  .iconbtn:focus-visible { outline: 2px solid var(--m-accent); outline-offset: -3px; }
  .iconbtn svg { width: 22px; height: 22px; fill: currentColor; }

  .body-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
  }

  .card {
    background: var(--m-surface);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Вся карточка профиля — кнопка выбора тарифа */
  .card.tap { cursor: pointer; border: 1px solid var(--m-outline); }
  .card.tap:hover { background: #1f2731; border-color: var(--m-dim); }
  .card.tap:active { background: #263040; }
  .card.tap.sel { border-color: var(--m-go); }

  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }


  .label {
    font-size: 11px;
    letter-spacing: .09em;
    color: var(--m-dim);
    font-weight: 700;
  }

  .small { font-size: 12px; color: var(--m-dim); }
  .mono { font-family: "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }

  .kv {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 14px;
  }

  .kv span:first-child { color: var(--m-dim); }
  .kv span:last-child { font-family: "Roboto Mono", monospace; font-weight: 500; font-variant-numeric: tabular-nums; }

  /* Поле-селектор профиля: имитация OutlinedTextField */

  /* Название тарифа над расчётом; нажатие ведёт к выбору тарифа */
  .profile-name {
    text-align: center;
    font-size: 17px;
    font-weight: 500;
    color: var(--m-on);
    padding-top: 4px;
    cursor: pointer;
  }

  .profile-sub { text-align: center; font-size: 12px; color: var(--m-dim); cursor: pointer; }

  .odometer { text-align: center; }

  .odometer .big {
    font-family: "Roboto Mono", monospace;
    font-weight: 700;
    font-size: 58px;
    line-height: 1;
    color: var(--m-accent);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .odometer .unit { color: var(--m-dim); font-size: 16px; margin-left: 8px; }

  /* Дополнительные услуги: галочку поставить — убрать */
  .service {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 0;
    cursor: pointer;
    font-size: 16px;
  }

  .service:hover .checkbox { border-color: var(--m-dim); }

  .checkbox {
    width: 20px;
    height: 20px;
    border-radius: 3px;
    border: 2px solid var(--m-dim);
    flex: none;
    display: grid;
    place-items: center;
    transition: background .12s, border-color .12s;
  }

  .checkbox.on { background: var(--m-accent); border-color: var(--m-accent); }
  .checkbox svg { width: 16px; height: 16px; fill: #101418; }

  /* Кнопка сохранения: обычной высоты и спокойного цвета */
  .savebtn {
    flex: none;
    height: 52px;
    border: 0;
    border-radius: 14px;
    background: var(--m-variant);
    color: var(--m-on);
    font-family: Roboto, sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .savebtn:hover { background: #2c3849; }
  .savebtn:active { transform: translateY(1px); }

  .fab {
    position: absolute;
    right: 18px;
    bottom: 18px;
    width: 56px;
    height: 56px;
    border-radius: 18px;
    border: 0;
    background: var(--m-accent);
    color: #101418;
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .4);
  }

  .fab svg { width: 24px; height: 24px; fill: currentColor; }

  .textbtn {
    background: none;
    border: 0;
    color: var(--m-accent);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .textbtn:hover { background: rgba(255, 212, 38, .1); }
  .textbtn:disabled { color: var(--m-dim); cursor: default; background: none; }

  .minput {
    width: 100%;
    background: none;
    border: 1px solid var(--m-outline);
    border-radius: 6px;
    color: var(--m-on);
    font-family: "Roboto Mono", monospace;
    font-size: 16px;
    padding: 12px 14px;
  }

  .minput:focus { outline: none; border-color: var(--m-accent); }
  .mfield { position: relative; }

  /* Поля калькулятора: крупные цифры и единица справа внутри рамки */
  .minput.big { font-size: 22px; font-weight: 700; padding: 14px 52px 14px 14px; }
  .minput:disabled { color: var(--m-accent); opacity: 1; }

  /* Кнопки счётчика под полями */
  .meterrow { display: flex; gap: 10px; }

  .meterbtn {
    flex: 1;
    height: 56px;
    border: 0;
    border-radius: 18px;
    color: #101418;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
  }

  .meterbtn:disabled { opacity: .4; cursor: default; }
  .meterbtn:not(:disabled):active { transform: translateY(1px); }

  .coarsebar {
    display: flex;
    align-items: center;
    margin: 4px 16px;
    padding: 10px 12px;
    border-radius: 12px;
    background: color-mix(in srgb, var(--m-accent) 16%, transparent);
    color: var(--m-accent);
    font-size: 12px;
    font-weight: 700;
    flex: none;
  }

  /* Полоса о потере сигнала */
  .warnbar {
    display: flex;
    align-items: center;
    margin: 4px 16px;
    padding: 10px 12px;
    border-radius: 12px;
    background: color-mix(in srgb, var(--m-wait) 16%, transparent);
    color: var(--m-wait);
    font-size: 12px;
    flex: none;
  }

  /* Переключатель в настройках */
  .switch {
    width: 46px;
    height: 26px;
    border-radius: 13px;
    background: var(--m-variant);
    border: 1px solid var(--m-outline);
    flex: none;
    display: flex;
    align-items: center;
    padding: 2px;
    transition: background .15s;
  }

  .switch .knob {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--m-dim);
    transition: transform .15s, background .15s;
  }

  .switch.on { background: var(--m-go); border-color: var(--m-go); }
  .switch.on .knob { transform: translateX(20px); background: #101418; }

  .mfield .funit {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: var(--m-dim);
    pointer-events: none;
  }

  .savednote {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 56px;
    padding: 8px 14px;
    border-radius: 18px;
    background: color-mix(in srgb, var(--m-go) 14%, transparent);
    color: var(--m-go);
    font-size: 13px;
    font-weight: 500;
  }

  .savednote svg { width: 20px; height: 20px; fill: currentColor; flex: none; }

  /* Кнопки под калькулятором: сохранить и сбросить */
  .ctrl-col { display: grid; gap: 8px; padding: 12px 16px; flex: none; }

  .resetbtn {
    width: 100%;
    height: 48px;
    background: var(--m-variant);
    border: 0;
    border-radius: 18px;
    color: var(--m-on);
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
  }

  .resetbtn:disabled { opacity: .4; cursor: default; }
  .resetbtn:not(:disabled):hover { background: #2c3849; }
  .resetbtn:not(:disabled):active { transform: translateY(1px); }

  .mfield .flabel {
    position: absolute;
    top: -8px;
    left: 11px;
    background: var(--m-bg);
    padding: 0 5px;
    font-size: 11px;
    color: var(--m-dim);
    pointer-events: none;
  }

  /* AlertDialog подтверждения — как в ProfilesScreen.kt */
  .scrim {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, .62);
    display: grid;
    place-items: center;
    padding: 24px;
    z-index: 5;
  }

  .dialog {
    background: #232b36;
    border-radius: 28px;
    padding: 24px;
    width: 100%;
    max-width: 300px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .dialog h3 { margin: 0; font-size: 22px; font-weight: 400; color: var(--m-on); }
  .dialog .dtext { font-size: 14px; color: var(--m-dim); }
  .dialog .dactions { display: flex; justify-content: flex-end; gap: 4px; margin-top: 10px; }
  hr { border: 0; border-top: 1px solid var(--m-outline); margin: 2px 0; width: 100%; }

  /* Предупреждение красной плашкой: пустое не показывается */
  .errbox {
    background: color-mix(in srgb, var(--m-stop) 18%, transparent);
    color: var(--m-stop);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 12px;
    font-weight: 500;
  }

  .errbox:empty { display: none; }

  .toast.err {
    background: var(--m-stop);
    color: #fff;
    font-weight: 700;
  }

  .toast {
    position: absolute;
    left: 16px;
    right: 16px;
    /* Выше кнопок: сообщение не должно их закрывать */
    bottom: 132px;
    background: #e6eaf0;
    color: #14181d;
    border-radius: 6px;
    padding: 13px 16px;
    font-size: 14px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .5);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tile {
    background: var(--m-variant);
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
  }

  .tile .v {
    font-family: "Roboto Mono", monospace;
    font-weight: 700;
    font-size: 19px;
    font-variant-numeric: tabular-nums;
  }

  /* Статистика */
  .seg {
    display: flex;
    border: 1px solid var(--m-outline);
    border-radius: 20px;
    overflow: hidden;
    flex: none;
  }

  .seg button {
    flex: 1;
    border: 0;
    border-left: 1px solid var(--m-outline);
    background: none;
    color: var(--m-dim);
    font-family: Roboto, sans-serif;
    font-size: 13px;
    padding: 9px 4px;
    cursor: pointer;
  }

  .seg button:first-child { border-left: 0; }
  .seg button.on { background: var(--m-variant); color: var(--m-on); font-weight: 700; }
  .seg button:hover:not(.on) { color: var(--m-on); }

  /* Кольцо долей оплаты */
  .donut-wrap { display: grid; gap: 14px; justify-items: center; padding-top: 4px; }
  .donut { width: 148px; height: 148px; transform: rotate(-90deg); }
  .donut circle { fill: none; stroke-width: 6.5; }
  .donut .seg { stroke-linecap: butt; }

  .legend-list { display: grid; gap: 8px; width: 100%; }

  .legend {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
  }

  .lg-pct { font-size: 12px; color: var(--m-dim); }

  .lg-leader {
    flex: 1;
    border-bottom: 1px dotted var(--m-outline);
    height: 1px;
    margin: 0 2px;
  }

  .lg-val { font-weight: 700; }

  .chart {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 104px;
  }

  .bar-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    cursor: pointer;
  }

  .bar { width: 100%; border-radius: 3px 3px 0 0; }

  /* Подпись над выбранным столбиком */
  .chart-wrap { position: relative; padding-top: 38px; }

  .bar-tip {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    background: var(--m-variant);
    border: 1px solid var(--m-outline);
    border-radius: 8px;
    padding: 4px 9px;
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
  }

  .bar-tip-day { font-size: 10px; color: var(--m-dim); }
  .bar-tip-sum { font-size: 13px; font-weight: 700; color: var(--m-accent); }

  /* Ложе столбика: по нему видно, где кончается один день и начинается другой */
  .bar-track {
    width: 100%;
    height: 84px;
    display: flex;
    align-items: flex-end;
    background: rgba(255, 255, 255, .04);
    border-radius: 4px;
    overflow: hidden;
  }

  .bar-col.sel .bar-track { background: rgba(255, 255, 255, .12); }
  .bar-col.sel .bar-label { color: var(--m-on); font-weight: 700; }

  .bar-label {
    font-size: 9px;
    color: var(--m-dim);
    padding-top: 4px;
    white-space: nowrap;
  }


  /* Строка дня в списке поездок за неделю или месяц */
  .dayrow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 16px;
    border-radius: 12px;
    background: var(--m-surface);
    font-size: 16px;
  }

  .dayrow.tap { cursor: pointer; border: 1px solid var(--m-outline); }
  .dayrow.tap:hover { background: #1f2731; border-color: var(--m-dim); }
  .dayrow.today { border-color: var(--m-go); }
  .dayrow.empty { background: none; color: var(--m-dim); padding: 9px 16px; }
  .daysum { font-size: 15px; font-weight: 700; color: var(--m-accent); }
  /* Пометка «посчитано калькулятором» слева, по центру карточки */
  .triprow { display: flex; align-items: center; gap: 10px; }
  .tripmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }

  .calcmark {
    display: grid;
    place-items: center;
    width: 26px;
    color: var(--m-dim);
    flex: none;
  }

  .calcmark svg { width: 18px; height: 18px; fill: currentColor; }

  .trashbtn { width: 32px; height: 32px; color: var(--m-stop); flex: none; }
  .trashbtn svg { width: 18px; height: 18px; }


  .dtotal {
    text-align: center;
    font-family: "Roboto Mono", monospace;
    font-weight: 700;
    font-size: 38px;
    line-height: 1.1;
    color: var(--m-accent);
    font-variant-numeric: tabular-nums;
  }

  .dtotal .cur { font-family: Roboto, sans-serif; font-size: 14px; font-weight: 400; color: var(--m-dim); margin-left: 6px; }


  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="phone">
  <div class="screen" id="screen">
    <div class="statusbar">
      <span id="sbClock">14:32</span>
      <span>▮▮▮ 78%</span>
    </div>
    <div id="screenBody" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
    <div id="dialogHost"></div>
    <div id="toast" class="toast" hidden></div>
  </div>
</div>

<script>
  "use strict";

  /* ═══ Иконки Material, те же, что в приложении ═══ */
  const ICON = {
    back: 'M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z',
    add: 'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z',
    del: 'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z',
    check: 'M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',
    chart: 'M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z',
    calc: 'M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm1 3v3h10V5H7zm0 5.5v2h2.5v-2H7zm4.25 0v2h1.5v-2h-1.5zm3.25 0v2H17v-2h-2.5zM7 14v2h2.5v-2H7zm4.25 0v2h1.5v-2h-1.5zm3.25 0v2H17v-2h-2.5zM7 17.5v2h2.5v-2H7zm4.25 0v2h1.5v-2h-1.5zm3.25 0v2H17v-2h-2.5z',
    settings: 'M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z'
  };
  const svg = (name, cls) =>
    `<svg viewBox="0 0 24 24"${cls ? ` class="${cls}"` : ''} aria-hidden="true"><path fill-rule="evenodd" d="${ICON[name]}"/></svg>`;

  /* ═══ Хранилище ═══ */
  const LS = 'taxi-proto-v1';
  const defaults = () => ([
    { id: 'p1', name: 'Місто', pricePerKm: 15, pricePerIdleMinute: 2, minPrice: 60, minDistanceKm: 2 },
    { id: 'p2', name: 'Нічний', pricePerKm: 20, pricePerIdleMinute: 3, minPrice: 90, minDistanceKm: 2 }
  ]);

  /* data/Profile.kt → ExtraService; цены общие для всех тарифов */
  const SERVICES = [
    { key: 'CHILDREN', title: 'Діти', field: 'children' },
    { key: 'PETS', title: 'Тварини', field: 'pets' },
    { key: 'LUGGAGE', title: 'Багаж у салоні', field: 'luggage' }
  ];

  const defaultServicePrices = () => ({ children: 20, pets: 30, luggage: 20 });

  /* data/TripRecord.kt → PaymentMethod */
  const PAYMENTS = [
    { key: 'CASH', title: 'Готівка' },
    { key: 'CARD', title: 'Картка' }
  ];

  /** Подпись способа оплаты: в записи хранится ключ, а не текст. */
  const paymentTitle = t => (PAYMENTS.find(x => x.key === t.payment) || {}).title || '';

  function load() {
    try {
      const raw = localStorage.getItem(LS);
      if (!raw) return null;
      const v = JSON.parse(raw);
      // Пустой список тарифов — это выбор водителя, а не испорченное
      // сохранение: заводские возвращать не нужно.
      if (!v || !Array.isArray(v.profiles)) return null;
      // Сохранения до выноса услуг в общие настройки
      if (!v.servicePrices) v.servicePrices = defaultServicePrices();
      SERVICES.forEach(s => {
        if (typeof v.servicePrices[s.field] !== 'number') v.servicePrices[s.field] = 0;
      });
      return v;
    } catch (e) { return null; }
  }

  function save() {
    try {
      localStorage.setItem(LS, JSON.stringify({
        v: 7,
        profiles: S.profiles,
        activeId: S.activeId,
        gpsEnabled: S.gpsEnabled,
        coarseEnabled: S.coarseEnabled,
        trips: S.trips,
        servicePrices: S.servicePrices
      }));
    } catch (e) { /* приватное окно — работаем без сохранения */ }
  }

  const stored = load();

  const S = {
    /* Стек экранов: «назад» всегда возвращает туда, откуда пришли */
    stack: ['calc'],
    profiles: stored ? stored.profiles : defaults(),
    activeId: stored ? stored.activeId : 'p1',
    editing: null,
    pendingDelete: null,
    /* Доплати общие для всех тарифов */
    servicePrices: stored ? stored.servicePrices : defaultServicePrices(),
    /* AppSettings.gpsEnabled — галочка «лічильник по GPS» */
    gpsEnabled: stored ? !!stored.gpsEnabled : false,
    /* AppSettings.coarseEnabled — считать по вышкам без спутников */
    coarseEnabled: stored ? !!stored.coarseEnabled : false,
    /* Только в прототипе: имитация глушения спутников */
    jammed: false,
    /* Сохранённые поездки, новые первыми */
    trips: stored && Array.isArray(stored.trips) ? stored.trips : [],
    /* Выбранный день в списке поездок за неделю или месяц */
    pickedDay: null,
    /* Попап со способом оплаты после «Стоп» */
    paymentDialog: false,
    /* Выбранный столбик графика в статистике */
    pickedBucket: null,
    /* Запись, в которую ещё дописываются правки: null — нечего дописывать */
    lastSavedKey: null,
    /* Статистика: период и раскрытая поездка */
    statsPeriod: 'DAY',
    pendingTripDelete: null,
    expandedTrip: null,
    /* meter/DistanceMeter.kt — состояние счётчика */
    meter: { state: 'IDLE', km: 0, coarseKm: 0, idleMs: 0, speed: 0, coarse: false, startedAt: 0 },
    /* data/CalcInput.kt — что водитель ввёл в калькуляторе */
    calc: { distanceText: '', idleText: '', services: [], payment: null }
  };

  /* Имена профилей вводит пользователь — экранируем перед вставкой в разметку */
  const esc = s => String(s === null || s === undefined ? '' : s).replace(
    /[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
  );

  const screenName = () => S.stack[S.stack.length - 1];
  const activeProfile = () => S.profiles.find(p => p.id === S.activeId) || S.profiles[0] || null;

  /* ═══ Арифметика — перенос из data/Profile.kt ═══ */
  const round2 = v => Math.round(v * 100) / 100;
  const fmt = (v, d) => (v === null || v === undefined || !isFinite(v) ? '—' : v.toFixed(d === undefined ? 2 : d));

  /* Округление вверх с запасом на погрешность double: ровно 2 км
     не должны открывать третий километр. */
  const ceilUnits = v => Math.max(0, Math.ceil(v - 1e-9));

  function calculateFare(p, distanceKm, idleSeconds, services, servicePrices) {
    if (!p) return null;
    const km = Math.max(0, distanceKm);

    // Каждая начатая минута простоя оплачивается целиком
    const billedIdleMinutes = ceilUnits(Math.max(0, idleSeconds) / 60);
    const idlePart = billedIdleMinutes * p.pricePerIdleMinute;

    // Каждый начатый километр сверх минимального расстояния — целиком
    const billedKm = ceilUnits(km - p.minDistanceKm);

    // Доплати за послуги прибавляются к минимальной цене поездки
    const prices = servicePrices || defaultServicePrices();
    const servicesPart = (services || []).reduce((sum, key) => {
      const s = SERVICES.find(x => x.key === key);
      return sum + (s ? (prices[s.field] || 0) : 0);
    }, 0);
    const effectiveMinPrice = p.minPrice + servicesPart;

    let distancePart, minApplied;
    if (p.minDistanceKm > 0) {
      distancePart = effectiveMinPrice + billedKm * p.pricePerKm;
      minApplied = billedKm === 0;
    } else {
      const raw = billedKm * p.pricePerKm;
      if (raw < effectiveMinPrice) { distancePart = effectiveMinPrice; minApplied = true; }
      else { distancePart = raw; minApplied = false; }
    }

    return {
      distanceKm: km, billedKm, billedIdleMinutes,
      distancePart: round2(distancePart),
      servicesPart: round2(servicesPart),
      idlePart: round2(idlePart),
      total: round2(distancePart + idlePart),
      minPriceApplied: minApplied
    };
  }


  /* meter/MeterService.kt → formatClock: момент по часам телефона */
  function formatClock(epochMs) {
    if (!epochMs || epochMs <= 0) return '—';
    const d = new Date(epochMs);
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  /* meter/MeterService.kt → formatDate */
  /** День и месяц для подписи над столбиком: «14 вересня». */
  const dayLabel = ms => {
    const d = new Date(ms);
    return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
  };

  const MONTHS = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня',
    'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];
  function formatDate(epochMs) {
    if (!epochMs || epochMs <= 0) return '—';
    const d = new Date(epochMs);
    return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${formatClock(epochMs)}`;
  }

  /* data/Stats.kt — периоды и агрегаты */
  const PERIODS = [
    { key: 'DAY', title: 'День', hint: 'з початку доби', days: 1 },
    { key: 'WEEK', title: 'Тиждень', hint: 'поточний тиждень, Пн — Нд', days: 7 },
    { key: 'MONTH', title: 'Місяць', hint: 'поточний місяць', days: 0 },
    { key: 'ALL', title: 'Усе', hint: 'усі збережені поїздки', days: 0 }
  ];
  const WEEKDAYS = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
  const WEEKDAYS_FULL = ['Неділя', 'Понеділок', 'Вівторок', 'Середа',
    'Четвер', 'Пʼятниця', 'Субота'];

  const startOfDay = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const DAY_MS = 86400000;

  /** Понедельник текущей недели. */
  const startOfWeek = ms => {
    const d = new Date(ms);
    d.setHours(0, 0, 0, 0);
    // getDay(): 0 — воскресенье, поэтому сдвигаем начало на понедельник
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return d.getTime();
  };

  /** Первое число текущего месяца. */
  const startOfMonth = ms => {
    const d = new Date(ms);
    d.setDate(1);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  };

  /** Сколько дней в месяце, на который попадает ms. */
  const daysInMonth = ms => {
    const d = new Date(ms);
    return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  };

  function periodStartMs(periodKey, nowMs) {
    // Неделя и месяц считаются календарные: понедельник — воскресенье
    // и числа от первого до конца. Иначе список дней разошёлся бы
    // с итогами, да и водитель считает неделю именно так.
    if (periodKey === 'WEEK') return startOfWeek(nowMs);
    if (periodKey === 'MONTH') return startOfMonth(nowMs);
    const p = PERIODS.find(x => x.key === periodKey);
    if (!p || p.days === 0) return 0;
    return startOfDay(nowMs) - (p.days - 1) * DAY_MS;
  }

  function buildStats(periodKey, nowMs) {
    const fromMs = periodStartMs(periodKey, nowMs);
    const trips = S.trips.filter(t => t.finishedAtWallMs >= fromMs);

    const sum = f => trips.reduce((a, t) => a + (f(t) || 0), 0);
    const revenue = sum(t => t.total);
    const cash = trips.filter(t => t.payment === 'CASH').reduce((a, t) => a + t.total, 0);
    const card = trips.filter(t => t.payment === 'CARD').reduce((a, t) => a + t.total, 0);
    const distanceKm = sum(t => t.distanceKm);
    const idleMs = sum(t => t.idleMs);

    const byProfileMap = {};
    const days = {};
    trips.forEach(t => {
      const name = t.profileName || 'Без тарифу';
      byProfileMap[name] = byProfileMap[name] || { name, trips: 0, revenue: 0 };
      byProfileMap[name].trips++;
      byProfileMap[name].revenue += t.total;

      days[startOfDay(t.finishedAtWallMs)] = true;
    });
    const daysWithTrips = Object.keys(days).length;

    let buckets, bucketTitle = 'ВИТОРГ ПО ДНЯХ';
    if (periodKey === 'DAY') {
      // За день график не строим: внутри суток он мало что объясняет
      buckets = [];
      bucketTitle = '';
    } else if (periodKey === 'ALL') {
      buckets = allTimeBuckets(trips, nowMs);
    } else {
      // Месяц рисуем с первого числа по сегодня: будущие дни пустые
      const days = periodKey === 'MONTH'
        ? new Date(nowMs).getDate()
        : PERIODS.find(x => x.key === periodKey).days;
      buckets = dailyBuckets(trips, fromMs, days, nowMs);
    }

    return {
      trips: trips.slice().sort((a, b) => b.finishedAtWallMs - a.finishedAtWallMs),
      tripCount: trips.length,
      revenue, cash, card, distanceKm, idleMs, daysWithTrips,
      // Выручка поездок без отметки об оплате: только у старых записей,
      // сделанных до того, как способ оплаты стал обязательным
      unpaid: Math.max(0, revenue - cash - card),
      servicesTotal: sum(t => t.servicesTotal),
      maxTrip: trips.reduce((a, t) => Math.max(a, t.total), 0),
      tripsPerDay: daysWithTrips ? trips.length / daysWithTrips : 0,
      revenuePerDay: daysWithTrips ? revenue / daysWithTrips : 0,
      byProfile: Object.values(byProfileMap).sort((a, b) => b.revenue - a.revenue),
      buckets, bucketTitle
    };
  }

  /* Дневные столбики за days дней, начиная с fromMs */
  function dailyBuckets(trips, fromMs, days, nowMs) {
    const sums = new Array(days).fill(0);
    trips.forEach(t => {
      const i = Math.round((startOfDay(t.finishedAtWallMs) - fromMs) / DAY_MS);
      if (i >= 0 && i < days) sums[i] += t.total;
    });
    const todayStart = startOfDay(nowMs);
    const out = [];
    for (let i = 0; i < days; i++) {
      const dayStart = fromMs + i * DAY_MS;
      const d = new Date(dayStart);
      let label = '';
      if (days <= 7) label = WEEKDAYS[d.getDay()];
      else if (i % 5 === 0 || i === days - 1) label = String(d.getDate());
      // День нужен целиком: по нажатию на столбик показываем дату
      out.push({
        label, value: sums[i], ms: dayStart,
        emphasized: startOfDay(dayStart) === todayStart
      });
    }
    return out;
  }

  /* Для «Усе» — от первой поездки до сегодня, но не больше 60 столбиков */
  function allTimeBuckets(trips, nowMs) {
    if (!trips.length) return [];
    const firstDay = trips.reduce((a, t) => Math.min(a, startOfDay(t.finishedAtWallMs)), Infinity);
    const span = Math.round((startOfDay(nowMs) - firstDay) / DAY_MS) + 1;
    const days = Math.max(1, Math.min(60, span));
    return dailyBuckets(trips, startOfDay(nowMs) - (days - 1) * DAY_MS, days, nowMs);
  }


  /** Длительность поездки: ч:мм:сс или мм:сс. */
  function formatDuration(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    const pad = n => String(n).padStart(2, '0');
    return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }

  /* ui/Format.kt → formatMinutes */
  const formatMinutes = minutes => `${minutes} хв`;
  /* ═══ data/CalcInput.kt ═══ */
  /** Введённое расстояние; запятая с клавиатуры считается точкой. */
  const calcKm = () => {
    const v = parseFloat(String(S.calc.distanceText).replace(',', '.'));
    return isFinite(v) && v > 0 ? v : 0;
  };

  /** Ожидание вводится целыми минутами, поэтому округлять нечего. */
  const calcMinutes = () => {
    const v = parseInt(S.calc.idleText, 10);
    return isFinite(v) && v > 0 ? v : 0;
  };

  const calcEmpty = () =>
    calcKm() <= 0 && calcMinutes() === 0 && !S.calc.services.length && !S.calc.payment;

  const fare = () =>
    calculateFare(activeProfile(), calcKm(), calcMinutes() * 60, S.calc.services, S.servicePrices);

  /* ═══ meter/DistanceMeter.kt — имитация счётчика ═══ */

  /* В прототипе спутников нет, поэтому едем с постоянной скоростью */
  const DEMO_SPEED_KMH = 60;

  const meterMinutes = () => Math.max(0, Math.ceil(S.meter.idleMs / 60000 - 1e-9));

  /** Живые показания счётчика видны прямо в полях калькулятора. */
  function meterToCalc() {
    S.calc.distanceText = S.meter.km.toFixed(2);
    const m = meterMinutes();
    S.calc.idleText = m > 0 ? String(m) : '';
  }

  let lastReal = performance.now();

  /* Сколько уже длится глушение — в приложении это 20 секунд молчания */
  let jammedMs = 0;
  const SWITCH_TO_COARSE_MS = 20000;

  function tick(now) {
    const dt = Math.min(400, now - lastReal);
    lastReal = now;

    if (S.meter.state === 'RUNNING') {
      // Пока спутники глушат, приложение ждёт 20 секунд и только
      // потом переходит на грубый счёт по вышкам и Wi-Fi.
      const wasCoarse = S.meter.coarse;
      if (S.jammed) {
        jammedMs += dt;
        S.meter.coarse = S.coarseEnabled && jammedMs > SWITCH_TO_COARSE_MS;
      } else {
        jammedMs = 0;
        S.meter.coarse = false;
      }
      // Полоса вверху появляется и исчезает вместе с режимом, а её
      // рисует только полная перерисовка
      if (wasCoarse !== S.meter.coarse) render();

      if (S.jammed && !S.meter.coarse) {
        // Сигнала нет, грубый счёт ещё не включился — километры стоят
        S.meter.speed = 0;
      } else {
        S.meter.speed = DEMO_SPEED_KMH;
        const step = DEMO_SPEED_KMH * (dt / 3600000);
        S.meter.km += step;
        if (S.meter.coarse) S.meter.coarseKm += step;
      }
      meterToCalc();
    } else if (S.meter.state === 'PAUSED') {
      S.meter.speed = 0;
      S.meter.idleMs += dt;
      meterToCalc();
    }

    paintLive();
    requestAnimationFrame(tick);
  }

  /* ═══ Запись поездки ═══ */

  /**
   * Запись из того, что сейчас в калькуляторе.
   *
   * У поездки со счётчиком есть настоящие начало и конец; у расчёта
   * руками — только момент записи. Признак передаётся явно: состояние
   * счётчика доживает до следующего расчёта и соврало бы.
   */
  function tripFromCalc(key, metered, startedAt) {
    const p = activeProfile();
    const f = fare();
    return {
      metered: !!metered,
      startedAtWallMs: metered ? (startedAt || key) : key,
      finishedAtWallMs: key,
      distanceKm: f.distanceKm,
      runningMs: 0,
      idleMs: calcMinutes() * 60000,
      total: f.total,
      profileName: p ? p.name : '',
      services: S.calc.services.map(k => (SERVICES.find(s => s.key === k) || {}).title).filter(Boolean),
      payment: S.calc.payment || '',
      servicesTotal: f.servicesPart,
      coarseKm: S.meter.coarseKm || 0
    };
  }

  /**
   * Автосохранение по «Стоп»: поездку, посчитанную счётчиком, водителю
   * не нужно сохранять руками.
   */
  function recordTrip() {
    if (!activeProfile() || calcKm() <= 0) return;
    const key = Date.now();
    S.lastSavedKey = key;
    S.trips = [tripFromCalc(key, true, S.meter.startedAt)].concat(S.trips).slice(0, 500);
    save();
    toast(`Збережено: ${fmt(fare().total)} грн`);
  }

  /**
   * Пока запись остаётся текущей, правки дописываются в неё.
   *
   * Способ оплаты водитель отмечает уже после остановки, а километры
   * иногда поправляет руками — заводить на это вторую запись незачем.
   */
  function syncLastTrip() {
    if (!S.lastSavedKey) return;
    const i = S.trips.findIndex(t => t.finishedAtWallMs === S.lastSavedKey);
    if (i < 0) { S.lastSavedKey = null; return; }
    S.trips[i] = tripFromCalc(S.lastSavedKey, S.trips[i].metered, S.trips[i].startedAtWallMs);
    save();
  }

  /* ═══ Действия ═══ */
  let toastTimer = null;
  /**
   * Сообщение внизу экрана.
   *
   * Предупреждения красные: их водитель видит краем глаза за рулём,
   * и цвет должен сразу говорить, что дело не сделано.
   */
  function toast(msg, kind) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.toggle('err', kind === 'error');
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
  }

  const A = {
    resetCalc() {
      S.meter = { state: 'IDLE', km: 0, coarseKm: 0, idleMs: 0, speed: 0, coarse: false, startedAt: 0 };
      S.calc = { distanceText: '', idleText: '', services: [], payment: null };
      S.lastSavedKey = null;
      S.paymentDialog = false;
      render();
    },

    toggleGps() {
      S.gpsEnabled = !S.gpsEnabled;
      if (!S.gpsEnabled) S.meter.state = 'IDLE';
      save();
      render();
    },

    toggleCoarse() {
      S.coarseEnabled = !S.coarseEnabled;
      if (!S.coarseEnabled) S.meter.coarse = false;
      save();
      render();
    },

    /* Только в прототипе: кнопка, которой не будет в приложении */
    toggleJamming() {
      S.jammed = !S.jammed;
      jammedMs = 0;
      if (!S.jammed) S.meter.coarse = false;
      render();
    },

    startMeter() {
      // Без тарифа считать нечего: сумма всё равно не посчитается
      if (!activeProfile()) { toast('Створіть тарифний профіль', 'error'); return; }
      S.meter = {
        state: 'RUNNING', km: 0, coarseKm: 0, idleMs: 0,
        speed: DEMO_SPEED_KMH, coarse: false, startedAt: Date.now()
      };
      jammedMs = 0;
      S.lastSavedKey = null;
      meterToCalc();
      render();
    },

    selectPayment(key) {
      S.calc.payment = (S.calc.payment === key) ? null : key;
      syncLastTrip();
      render();
    },

    /* Ручное сохранение: нужно, когда счётчиком не пользовались */
    saveTrip() {
      const p = activeProfile();
      if (!p) { toast('Створіть тарифний профіль', 'error'); return; }
      if (calcKm() <= 0) { toast('Вкажіть відстань поїздки', 'error'); return; }
      if (!S.calc.payment) { toast('Виберіть спосіб оплати', 'error'); return; }

      const f = fare();
      S.trips = [tripFromCalc(Date.now(), false, 0)].concat(S.trips).slice(0, 500);
      save();
      toast(`Збережено: ${fmt(f.total)} грн`);
      A.resetCalc();
    },

    askDeleteTrip(key) { S.pendingTripDelete = Number(key); render(); },
    cancelDeleteTrip() { S.pendingTripDelete = null; render(); },

    /* Убрать поездку из истории и из статистики */
    confirmDeleteTrip() {
      const key = S.pendingTripDelete;
      S.pendingTripDelete = null;
      S.trips = S.trips.filter(t => t.finishedAtWallMs !== key);
      if (S.expandedTrip === key) S.expandedTrip = null;
      save();
      render();
    },

    pauseMeter() { S.meter.state = 'PAUSED'; render(); },
    resumeMeter() { S.meter.state = 'RUNNING'; render(); },

    /**
     * Стоп: поездка сразу уходит в историю, а итог остаётся в полях.
     *
     * Способ оплаты водитель отмечает уже после остановки, поэтому
     * запись потом дописывается — см. syncLastTrip.
     */
    stopMeter() {
      S.meter.state = 'IDLE';
      S.meter.speed = 0;
      S.meter.coarse = false;
      S.jammed = false;
      meterToCalc();
      // Поездка уходит в историю не сразу: сперва водитель отмечает,
      // чем с ним расплатились. Без этого разбивка выручки развалится.
      if (activeProfile() && calcKm() > 0) S.paymentDialog = true;
      render();
    },

    /* Выбор в попапе после «Стоп» */
    dialogPayment(key) {
      S.calc.payment = (S.calc.payment === key) ? null : key;
      render();
    },

    /* Завершить поездку: без способа оплаты кнопка не работает */
    finishTrip() {
      if (!S.calc.payment) return;
      S.paymentDialog = false;
      recordTrip();
      render();
    },

    toggleService(key) {
      S.calc.services = S.calc.services.includes(key)
        ? S.calc.services.filter(k => k !== key)
        : S.calc.services.concat(key);
      syncLastTrip();
      render();
    },

    go(next) { S.stack = S.stack.concat(next); render(); },
    back() { if (S.stack.length > 1) S.stack = S.stack.slice(0, -1); render(); },

    /* Вибір тарифу сразу возвращает к расчёту */
    selectProfile(id) { S.activeId = id; S.stack = ['calc']; save(); render(); },

    saveProfile(p) {
      const i = S.profiles.findIndex(x => x.id === p.id);
      if (i >= 0) S.profiles[i] = p; else S.profiles.push(p);
      S.editing = null; if (S.stack.length > 1) S.stack = S.stack.slice(0, -1); save(); render();
    },

    askDelete(id) { S.pendingDelete = id; render(); },
    cancelDelete() { S.pendingDelete = null; render(); },

    confirmDelete() {
      const id = S.pendingDelete;
      S.pendingDelete = null;
      // Пустой список — это выбор водителя, а не поломка: заводские
      // тарифы возвращать не нужно, иначе удалить их невозможно.
      S.profiles = S.profiles.filter(p => p.id !== id);
      if (!S.profiles.some(p => p.id === S.activeId)) {
        S.activeId = S.profiles.length ? S.profiles[0].id : null;
      }
      save(); render();
    },
  };

  /* ═══ Отрисовка ═══ */
  function appbar(title, showBack, actions) {
    return `<div class="appbar">
      ${showBack ? `<button class="iconbtn" data-act="back" aria-label="Назад">${svg('back')}</button>` : ''}
      <div class="t">${title}</div>${actions || ''}</div>`;

  /**
   * ui/StatisticsScreen.kt → PaymentSplit.
   * Кольцо долей оплаты и подписи с суммами под ним. Радиус 15.915
   * даёт длину окружности ровно 100, поэтому доли задаются процентами.
   */
  function donut(st) {
    // Доли считаются от оплаченного, а не от всей выручки: иначе поездки
    // без отметки об оплате оставляли бы в кольце пустой сектор.
    const base = st.cash + st.card;
    if (base <= 0) return '';
    const cash = st.cash / base * 100;
    const card = 100 - cash;
    const gap = (cash > 0 && card > 0) ? 1.2 : 0;

    const seg = (percent, offset, color) => {
      if (percent <= 0) return '';
      const len = Math.max(0.4, percent - gap);
      return `<circle class="seg" cx="21" cy="21" r="15.915" stroke="${color}"
        stroke-dasharray="${len.toFixed(2)} ${(100 - len).toFixed(2)}"
        stroke-dashoffset="${offset.toFixed(2)}"/>`;
    };

    const row = (color, name, percent, value) => `<div class="legend">
      <span class="dot" style="background:${color}"></span>
      <span class="lg-name">${name}</span>
      <span class="lg-pct">${Math.round(percent)} %</span>
      <span class="lg-leader"></span>
      <span class="lg-val mono">${fmt(value)} грн</span>
    </div>`;

    return `<div class="donut-wrap">
      <svg class="donut" viewBox="0 0 42 42" aria-hidden="true">
        ${seg(cash, 25 - gap / 2, 'var(--m-go)')}
        ${seg(card, 25 - cash - gap / 2, 'var(--m-card)')}
      </svg>
      <div class="legend-list">
        ${row('var(--m-go)', 'Готівка', cash, st.cash)}
        ${row('var(--m-card)', 'Картка', card, st.card)}
      </div>
    </div>`;
  }

  /* ui/StatisticsScreen.kt */
  function statisticsScreen() {
    const now = Date.now();
    const period = S.statsPeriod;
    const st = buildStats(period, now);
    const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;

    const tabs = `<div class="seg">
      ${PERIODS.map(p => `<button type="button" data-act="statsPeriod" data-arg="${p.key}"
        class="${p.key === period ? 'on' : ''}">${p.title}</button>`).join('')}
    </div>`;
    const hint = (PERIODS.find(p => p.key === period) || {}).hint;

    let body = '';

    if (!st.tripCount) {
      body = `<div class="card">
        <div style="font-size:17px;font-weight:500">За період немає поїздок</div>
        <div class="small">Завершіть першу поїздку — усе порахується само.</div>
      </div>`;
    } else {
      body += `<div class="card">
        <div class="dtotal" style="font-size:40px">${fmt(st.revenue)}<span class="cur">грн</span></div>
        ${donut(st)}
        <hr>
        <div class="tiles">
          <div class="tile"><div class="label">ПОЇЗДОК</div><div class="v">${st.tripCount}</div></div>
          <div class="tile"><div class="label">КМ</div><div class="v">${fmt(st.distanceKm, 1)}</div></div>
        </div>
      </div>`;

      if (st.byProfile.length > 1) {
        body += `<div class="card">
          <div class="label">ЗА ТАРИФАМИ</div>
          ${st.byProfile.map(p =>
            `<div class="kv"><span>${esc(p.name)} · ${p.trips}</span><span>${fmt(p.revenue)} грн</span></div>`
          ).join('')}
        </div>`;
      }

      const maxBucket = st.buckets.reduce((a, b) => Math.max(a, b.value), 0);
      if (maxBucket > 0) {
        // Подпись над выбранным столбиком: столбиков много, подписать
        // каждый негде, поэтому сумма показывается по нажатию
        const picked = (S.pickedBucket !== null && st.buckets[S.pickedBucket])
          ? S.pickedBucket : null;
        let tip = '';
        if (picked !== null) {
          const pos = (picked + 0.5) / st.buckets.length;
          // У краёв подпись разворачивается внутрь, иначе её срежет карточка
          const shift = pos < 0.2 ? 'translateX(0)'
            : pos > 0.8 ? 'translateX(-100%)' : 'translateX(-50%)';
          tip = `<div class="bar-tip" style="left:${(pos * 100).toFixed(2)}%;transform:${shift}">
            <div class="bar-tip-day">${dayLabel(st.buckets[picked].ms)}</div>
            <div class="bar-tip-sum mono">${fmt(st.buckets[picked].value)} грн</div>
          </div>`;
        }

        body += `<div class="card">
          <div class="row between">
            <span class="label">${st.bucketTitle}</span>
            <span class="label">макс. ${fmt(maxBucket)} грн</span>
          </div>
          <div class="chart-wrap">
            ${tip}
            <div class="chart">
              ${st.buckets.map((b, i) => {
                const ratio = b.value / maxBucket;
                const color = b.value <= 0 ? 'var(--m-outline)'
                  : (b.emphasized ? 'var(--m-go)' : 'var(--m-accent)');
                return `<div class="bar-col${i === picked ? ' sel' : ''}"
                  data-act="pickBucket" data-arg="${i}">
                  <div class="bar-track">
                    <div class="bar" style="height:${(2 + 82 * ratio).toFixed(1)}px;background:${color}"></div>
                  </div>
                  <div class="bar-label">${b.label}</div>
                </div>`;
              }).join('')}
            </div>
          </div>
        </div>`;
      }

      body += `<div class="card">
        <div class="label">ДОДАТКОВО</div>
        ${kv('Найдорожча', `${fmt(st.maxTrip)} грн`)}
        ${st.idleMs > 0 ? kv('Очікування', formatMinutes(Math.round(st.idleMs / 60000))) : ''}
        ${st.unpaid > 0 ? kv('Без позначки про оплату', `${fmt(st.unpaid)} грн`) : ''}
        ${(period !== 'DAY' && st.daysWithTrips > 1) ? `<hr>
          ${kv('Днів із поїздками', st.daysWithTrips)}
          ${kv('У середньому за день', `${fmt(st.revenuePerDay)} грн`)}
          ${kv('Поїздок на день', fmt(st.tripsPerDay, 1))}` : ''}
      </div>`;

      // Список поездок живёт на своём экране: он длинный и заслоняет
      // сводку, ради которой сюда заходят
      body += `<div class="card tap" data-act="go" data-arg="trips">
        <div class="row">
          <span style="font-size:17px;font-weight:700;letter-spacing:.04em">ПОЇЗДКИ</span>
          <span class="grow"></span>
          <span style="color:var(--m-dim);font-size:20px">&rsaquo;</span>
        </div>
      </div>`;
    }

    return appbar('Статистика', true)
      + `<div class="body-scroll">
        ${tabs}
        <div class="small" style="text-align:center">${hint}</div>
        ${body}
        <div style="height:16px"></div>
      </div>`;
  }

  const emptyCard = `<div class="card">

  /**
   * За день — сразу список поездок. За неделю и месяц их слишком много,
   * поэтому сперва дни, а поездки уже внутри дня.
   */
  function tripsScreen() {
    const period = S.statsPeriod;
    const st = buildStats(period, Date.now());

    if (period === 'DAY') {
      return appbar(`Поїздки · ${st.tripCount}`, true)
        + `<div class="body-scroll">

      + `<div class="body-scroll">

      </div>`;

  /** Дни периода: за неделю — по дням недели, за месяц — по числам. */
  function dayRows(period, trips) {
    const now = Date.now();
    const byDay = {};
    trips.forEach(t => {
      const key = startOfDay(t.finishedAtWallMs);
      byDay[key] = byDay[key] || { count: 0, total: 0 };
      byDay[key].count++;
      byDay[key].total += t.total;
    });

    let days = [];
    if (period === 'WEEK') {
      const from = periodStartMs('WEEK', now);
      for (let i = 0; i < 7; i++) days.push(from + i * DAY_MS);
    } else if (period === 'MONTH') {
      const from = startOfMonth(now);
      const total = daysInMonth(now);
      for (let i = 0; i < total; i++) days.push(from + i * DAY_MS);
    } else {
      // «Усе»: показываем только те дни, в которые что-то было
      days = Object.keys(byDay).map(Number).sort((a, b) => b - a);
    }

    if (!days.length) return emptyCard;

    const today = startOfDay(now);
    return days.map(ms => {
      const d = new Date(ms);
      const data = byDay[startOfDay(ms)];
      const title = period === 'MONTH'
        ? `${d.getDate()} (${WEEKDAYS[d.getDay()]})`
        : `${WEEKDAYS_FULL[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;

      if (!data) {
        return `<div class="dayrow empty">
          <span class="grow">${title}</span>
          <span class="small">—</span>
        </div>`;
      }

      return `<div class="dayrow tap${ms === today ? ' today' : ''}"
        data-act="pickDay" data-arg="${ms}">
        <span class="grow">${title}</span>
        <span class="small">${data.count} ${plural(data.count)}</span>
        <span class="mono daysum">${fmt(data.total)} грн</span>
      </div>`;
    }).join('');
  }

  const plural = n => (n % 10 === 1 && n % 100 !== 11) ? 'поїздка'
    : ([2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100)) ? 'поїздки' : 'поїздок';

  /** Поездки одного дня. */
  function dayTripsScreen() {
    const from = S.pickedDay;
    const to = from + DAY_MS;
    const trips = S.trips
      .filter(t => t.finishedAtWallMs >= from && t.finishedAtWallMs < to)
      .sort((a, b) => b.finishedAtWallMs - a.finishedAtWallMs);
    const d = new Date(from);

    return appbar(`${d.getDate()} ${MONTHS[d.getMonth()]} · ${trips.length}`, true)
      + `<div class="body-scroll">
        ${trips.length ? trips.map(t => tripCard(t, false)).join('') : emptyCard}
        <div style="height:16px"></div>
      </div>`;
  }

  /**

   * приложение считает стоимость по выбранному тарифу.
   */
  function calcScreen() {
    const p = activeProfile();
    const c = S.calc;
    const st = S.meter.state;

    // Со счётчиком поля заполняет он: руками их не трогаем совсем,
    // а до старта в них стоят нули, а не пустота.
    const locked = S.gpsEnabled;

    // Без тарифа считать нечего, поэтому кнопки не работают
    const noTariff = !p;

    const field = (id, label, unit, val, zero) => `<div class="mfield">
      <span class="flabel">${label}</span>
      <input class="minput big" id="${id}" inputmode="decimal" autocomplete="off"
        value="${esc(locked && val === '' ? zero : val)}"${locked ? ' disabled' : ''}>
      <span class="funit">${unit}</span>

    // Пока считаем грубо, полоса не ругается на сигнал: он и не нужен.
    // Но водитель должен видеть, что сумма приблизительная.
    const warn = !locked ? ''
      : S.meter.coarse
        ? '<div class="coarsebar">ПРИБЛИЗНО · немає супутників, рахуємо по вежах і Wi-Fi</div>'
        : S.jammed

      + `<div class="body-scroll" style="gap:14px">

            ? `<div class="errbox" data-act="go" data-arg="profiles" style="cursor:pointer">

               <div class="profile-sub" data-act="go" data-arg="profiles">${
                 fmt(p.pricePerKm)} грн/км · мін. ${fmt(p.minPrice)} грн до ${
                 fmt(p.minDistanceKm, 1)} км</div>`}
        </div>

        <div class="card odometer">
          <div class="label">ДО СПЛАТИ</div>

        </div>

        ${field('cDist', 'Відстань', 'км', c.distanceText, '0.00')}
        ${field('cIdle', 'Очікування', 'хв', c.idleText, '0')}

        ${S.gpsEnabled ? meterControls(st, noTariff) : ''}

        <div class="card">
          <div class="label">ДОДАТКОВІ ПОСЛУГИ</div>
          ${SERVICES.map(s => {
            const on = c.services.includes(s.key);
            return `<div class="service" data-act="toggleService" data-arg="${s.key}">
              <span class="checkbox${on ? ' on' : ''}">${on ? svg('check') : ''}</span>
              <span class="grow">${s.title}</span>
              <span class="mono" style="font-size:13px;color:${on ? 'var(--m-accent)' : 'var(--m-dim)'}">
                +${fmt(S.servicePrices[s.field] || 0)} грн</span>
            </div>`;
          }).join('')}
        </div>

        ${S.meter.coarseKm > 0 ? `<div class="small" style="text-align:center;color:var(--m-accent)">

        <div class="card">

          ${PAYMENTS.map(m => {
            const on = c.payment === m.key;
            return `<div class="service" data-act="selectPayment" data-arg="${m.key}">
              <span class="checkbox${on ? ' on' : ''}">${on ? svg('check') : ''}</span>
              <span class="grow">${m.title}</span>
            </div>`;
          }).join('')}
        </div>

        <div style="height:4px"></div>
      </div>

      <div class="ctrl-col">
        ${S.gpsEnabled
          // Со счётчиком поездка сохраняется сама по «Стоп», поэтому
          // кнопки нет вовсе — только отметка, что запись уже сделана
          // и правки в полях дописываются в неё.
          ? (S.lastSavedKey
            ? `<div class="savednote">${svg('check')}<span>Збережено в статистику —
                 відмітьте оплату, запис оновиться</span></div>`
            : '')
          : `<button class="meterbtn" style="background:var(--m-go);height:56px"
               data-act="saveTrip"${noTariff ? ' disabled' : ''}>ЗБЕРЕГТИ ПОЇЗДКУ</button>`}
        <button class="resetbtn" data-act="resetCalc"${
          (calcEmpty() && S.meter.state === 'IDLE') ? ' disabled' : ''}>СКИНУТИ</button>
      </div>`;
  }

  /**
   * Кнопки счётчика. В покое одна широкая «Почати поїздку», в работе —
   * очікування и стоп, на паузе — поїхали и стоп.
   */
  function meterControls(state, disabled) {
    const btn = (text, color, act) =>
      `<button class="meterbtn" style="background:${color}" data-act="${act}"${
        disabled ? ' disabled' : ''}>${text}</button>`;

    const row = state === 'IDLE'
      ? btn('ПОЧАТИ ПОЇЗДКУ', 'var(--m-go)', 'startMeter')
      : state === 'RUNNING'
        ? btn('ОЧІКУВАННЯ', 'var(--m-wait)', 'pauseMeter') + btn('СТОП', 'var(--m-stop)', 'stopMeter')
        : btn('ПОЇХАЛИ', 'var(--m-go)', 'resumeMeter') + btn('СТОП', 'var(--m-stop)', 'stopMeter');

    return `<div style="display:grid;gap:6px">
      <div class="meterrow">${row}</div>
      ${state === 'RUNNING'
        ? '<div class="small mono" style="text-align:center" id="cSpeed">0 км/год</div>' : ''}
    </div>`;
  }

  /**
   * Один экран в двух режимах: из калькулятора — только выбор тарифа,
   * из настроек — ещё создание, правка и удаление.
   */
  function profilesScreen() {
    // Карточка — кнопка выбора тарифа; шестерёнка и корзина внутри
    // перехватывают нажатие на себя.
    return appbar('Тарифи', true)
      + `<div class="body-scroll">
        ${S.profiles.length ? '' : `<div class="card">
          <div style="font-size:17px;font-weight:500">Тарифів немає</div>
          <div class="small">Додайте тариф кнопкою внизу — без нього
            калькулятор не порахує вартість.</div>
        </div>`}
        ${S.profiles.map(p => `
          <div class="card tap ${p.id === S.activeId ? 'sel' : ''}" data-act="selectProfile" data-arg="${p.id}">
            <div class="row">
              ${p.id === S.activeId ? `<span style="color:var(--m-go);display:grid;place-items:center">${svg('check')}</span>` : ''}
              <span class="grow" style="font-size:17px;font-weight:500">${esc(p.name)}</span>
              <button class="iconbtn" data-act="edit" data-arg="${p.id}" aria-label="Налаштувати тариф"
                style="color:var(--m-dim);width:38px;height:38px">${svg('settings')}</button>
              <button class="iconbtn" data-act="del" data-arg="${p.id}" aria-label="Видалити тариф"
                style="color:var(--m-stop);width:38px;height:38px">${svg('del')}</button>
            </div>
            <div class="kv"><span>Вартість 1 км</span><span>${fmt(p.pricePerKm)} грн</span></div>
            <div class="kv"><span>Простій</span><span>${fmt(p.pricePerIdleMinute)} грн/хв</span></div>
            <div class="kv"><span>Мінімальна ціна</span><span>${fmt(p.minPrice)} грн</span></div>
            <div class="kv"><span>Мінімальна відстань</span><span>${fmt(p.minDistanceKm, 1)} км</span></div>
          </div>`).join('')}

        <div style="height:70px"></div>
      </div>
      <button class="fab" data-act="edit" data-arg="new" aria-label="Додати тариф">${svg('add')}</button>`;
  }

  function editScreen() {
    const p = S.editing;
    const f = (id, label, val, mode) => `<div class="mfield"><span class="flabel">${label}</span>
      <input class="minput" id="${id}" value="${val}" ${mode ? 'inputmode="decimal"' : ''}></div>`;
    return appbar('Налаштування тарифу', true)
      + `<div class="body-scroll" style="gap:18px;padding-top:10px">
        <div class="mfield"><span class="flabel">Назва тарифу</span>
          <input class="minput" id="eName" value="${esc(p.name)}" style="font-family:Roboto,sans-serif"></div>
        ${f('eKm', 'Вартість 1 км, грн', fmt(p.pricePerKm), 1)}
        ${f('eIdle', 'Вартість простою, грн/хв', fmt(p.pricePerIdleMinute), 1)}
        ${f('eMin', 'Мінімальна ціна за поїздку, грн', fmt(p.minPrice), 1)}
        ${f('eMinD', 'Мін. відстань для мін. ціни, км', fmt(p.minDistanceKm, 1), 1)}
        <div class="errbox" id="eErr"></div>
        <button class="savebtn" data-act="saveProfile">Зберегти</button>
      </div>`;
  }

  /* ui/ProfilesScreen.kt → ServicePricesScreen */
  function servicePricesScreen() {
    const sp = S.servicePrices;
    const f = (id, label, val) => `<div class="mfield"><span class="flabel">${label}</span>
      <input class="minput" id="${id}" value="${val}" inputmode="decimal"></div>`;
    return appbar('Доплати за послуги', true)
      + `<div class="body-scroll" style="gap:18px;padding-top:10px">
        <div class="small">Діють на всіх тарифах. Увімкнена послуга додає свою ціну
          до мінімальної вартості поїздки.</div>
        ${f('sChildren', 'Діти, грн', fmt(sp.children || 0))}
        ${f('sPets', 'Тварини, грн', fmt(sp.pets || 0))}
        ${f('sLuggage', 'Багаж у салоні, грн', fmt(sp.luggage || 0))}
        <div class="errbox" id="sErr"></div>
        <button class="savebtn" data-act="saveServicePrices">Зберегти</button>
      </div>`;
  }

  /**
   * Попап после «Стоп»: сумма и способ оплаты.
   *
   * Мимо не закрывается и без выбора не завершает — иначе поездка
   * уйдёт в историю без отметки, и разбивка выручки развалится.
   */
  function paymentDialog() {
    const f = fare();
    if (!f) return '';
    const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;

    return `<div class="scrim">
      <div class="dialog wide">
        <h3 class="center">Поїздку завершено</h3>
        <div class="dtotal">${fmt(f.total)}<span class="cur">грн</span></div>
        <hr>
        ${kv('Відстань', `${fmt(f.distanceKm)} км`)}
        ${calcMinutes() > 0 ? kv('Очікування', formatMinutes(calcMinutes())) : ''}
        ${S.meter.coarseKm > 0 ? kv('З них приблизно', `${fmt(S.meter.coarseKm)} км`) : ''}
        <hr>
        <div class="label">СПОСІБ ОПЛАТИ</div>
        ${PAYMENTS.map(m => {
          const on = S.calc.payment === m.key;
          return `<div class="service" data-act="dialogPayment" data-arg="${m.key}">
            <span class="checkbox${on ? ' on' : ''}">${on ? svg('check') : ''}</span>
            <span class="grow">${m.title}</span>
          </div>`;
        }).join('')}
        ${S.calc.payment ? ''
          : '<div class="errbox">Виберіть спосіб оплати, щоб завершити</div>'}
        <div class="dactions center">
          <button class="textbtn" data-act="finishTrip"${
            S.calc.payment ? '' : ' disabled'}>Завершити поїздку</button>
        </div>
      </div>
    </div>`;
  }

  function render() {
    const host = document.getElementById('screenBody');

    /* Перестроение разметки сбрасывает прокрутку наверх: галочка услуги
       отбрасывала бы к началу экрана. */
    const prev = host.querySelector('.body-scroll');
    const keepScroll = prev && renderedScreen === screenName() ? prev.scrollTop : 0;
    renderedScreen = screenName();

    host.innerHTML = {
      calc: calcScreen,
      statistics: statisticsScreen,
      trips: tripsScreen,
      dayTrips: dayTripsScreen,
      settings: settingsScreen,
      profiles: profilesScreen,
      edit: editScreen,
      servicePrices: servicePricesScreen,
    }[screenName()]();

    const dlg = document.getElementById('dialogHost');
    const target = S.pendingDelete ? S.profiles.find(p => p.id === S.pendingDelete) : null;

    if (S.paymentDialog) {
      dlg.innerHTML = paymentDialog();
    } else if (target) {
      dlg.innerHTML = `<div class="scrim" data-act="cancelDelete">
           <div class="dialog" data-act="noop">
             <h3>Видалити тариф?</h3>
             <div class="dtext">${esc(target.name)}</div>
             <div class="dactions">
               <button class="textbtn" data-act="cancelDelete">Скасувати</button>
               <button class="textbtn" data-act="confirmDelete">Видалити</button>
             </div>
           </div>
         </div>`;
    } else if (S.pendingTripDelete) {
      const t = S.trips.find(x => x.finishedAtWallMs === S.pendingTripDelete);
      dlg.innerHTML = t ? `<div class="scrim" data-act="cancelDeleteTrip">
           <div class="dialog" data-act="noop">
             <h3>Видалити поїздку?</h3>
             <div class="dtext">${formatDate(t.finishedAtWallMs)} · ${fmt(t.total)} грн<br>
               Вона зникне з історії, і статистика перерахується.</div>
             <div class="dactions">
               <button class="textbtn" data-act="cancelDeleteTrip">Скасувати</button>
               <button class="textbtn" data-act="confirmDeleteTrip">Видалити</button>
             </div>
           </div>
         </div>` : '';
    } else {
      dlg.innerHTML = '';
    }

    if (keepScroll) {
      const next = host.querySelector('.body-scroll');
      if (next) next.scrollTop = keepScroll;
    }

    paintLive();
  }

  /** Какой экран сейчас отрисован — чтобы не переносить прокрутку чужому. */
  let renderedScreen = null;

  /* Значения, обновляемые без перестроения разметки: ввод не должен
     терять фокус и каретку на каждом нажатии клавиши */
  function paintLive() {
    const set = (id, txt) => { const el = document.getElementById(id); if (el && el.textContent !== txt) el.textContent = txt; };

    if (screenName() === 'calc') {
      const f = fare();
      set('cTotal', fmt(f ? f.total : 0));

      // Пока счётчик работает, он и заполняет поля
      if (S.meter.state !== 'IDLE') {
        const dist = document.getElementById('cDist');
        const idle = document.getElementById('cIdle');
        if (dist && dist.value !== S.calc.distanceText) dist.value = S.calc.distanceText;
        if (idle && idle.value !== S.calc.idleText) idle.value = S.calc.idleText;
        set('cSpeed', `${Math.round(S.meter.speed)} км/год`);
      }

      const reset = document.querySelector('.resetbtn');
      if (reset) reset.disabled = calcEmpty() && S.meter.state === 'IDLE';
    }

    const now = new Date();
    set('sbClock', `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);
  }

  /* ═══ События ═══ */
  const screenEl = document.getElementById('screen');

  /* Делегирование: closest() находит ближайший [data-act], поэтому кнопка
     внутри карточки профиля перехватывает клик у самой карточки. */
  screenEl.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act, arg = el.dataset.arg;

    switch (act) {
      case 'resetCalc': A.resetCalc(); break;
      case 'toggleGps': A.toggleGps(); break;
      case 'toggleCoarse': A.toggleCoarse(); break;
      case 'toggleJamming': A.toggleJamming(); break;
      case 'selectPayment': A.selectPayment(arg); break;
      case 'saveTrip': A.saveTrip(); break;
      case 'statsPeriod': S.statsPeriod = arg; S.expandedTrip = null; S.pickedBucket = null; render(); break;
      case 'pickDay': {
        S.pickedDay = Number(arg);
        S.expandedTrip = null;
        A.go('dayTrips');
        break;
      }
      case 'pickBucket': {
        const i = Number(arg);
        S.pickedBucket = (S.pickedBucket === i) ? null : i;
        render();
        break;
      }
      case 'dialogPayment': A.dialogPayment(arg); break;
      case 'finishTrip': A.finishTrip(); break;
      case 'askDeleteTrip': A.askDeleteTrip(arg); break;
      case 'cancelDeleteTrip': A.cancelDeleteTrip(); break;
      case 'confirmDeleteTrip': A.confirmDeleteTrip(); break;
      case 'expandTrip': {
        const key = Number(arg);
        S.expandedTrip = (S.expandedTrip === key) ? null : key;
        render();
        break;
      }
      case 'startMeter': A.startMeter(); break;
      case 'pauseMeter': A.pauseMeter(); break;
      case 'resumeMeter': A.resumeMeter(); break;
      case 'stopMeter': A.stopMeter(); break;
      case 'toggleService': A.toggleService(arg); break;
      case 'go': A.go(arg); break;
      case 'back': A.back(); break;
      case 'selectProfile': A.selectProfile(arg); break;
      case 'edit': {
        S.editing = arg === 'new'
          ? { id: 'p' + Date.now(), name: 'Новий тариф', pricePerKm: 15, pricePerIdleMinute: 2, minPrice: 60, minDistanceKm: 2 }
          : Object.assign({}, S.profiles.find(p => p.id === arg));
        S.stack = S.stack.concat('edit');
        render();
        break;
      }
      case 'del': A.askDelete(arg); break;
      case 'confirmDelete': A.confirmDelete(); break;
      case 'cancelDelete': A.cancelDelete(); break;
      case 'saveServicePrices': {
        const val = id => parseFloat((document.getElementById(id).value || '').replace(',', '.'));
        const ch = val('sChildren'), pe = val('sPets'), lu = val('sLuggage');
        const err = document.getElementById('sErr');
        if (!isFinite(ch) || ch < 0) err.textContent = 'Некоректна доплата за дітей';
        else if (!isFinite(pe) || pe < 0) err.textContent = 'Некоректна доплата за тварин';
        else if (!isFinite(lu) || lu < 0) err.textContent = 'Некоректна доплата за багаж';
        else {
          S.servicePrices = { children: ch, pets: pe, luggage: lu };
          S.stack = S.stack.slice(0, -1);
          save();
          render();
        }
        break;
      }
      case 'saveProfile': {
        const val = id => parseFloat((document.getElementById(id).value || '').replace(',', '.'));
        const name = document.getElementById('eName').value.trim();
        const km = val('eKm'), idle = val('eIdle'), min = val('eMin'), minD = val('eMinD');
        const err = document.getElementById('eErr');
        if (!name) err.textContent = 'Вкажіть назву тарифу';
        else if (!isFinite(km) || km < 0) err.textContent = 'Некоректна вартість за км';
        else if (!isFinite(idle) || idle < 0) err.textContent = 'Некоректна вартість простою';
        else if (!isFinite(min) || min < 0) err.textContent = 'Некоректна мінімальна ціна';
        else if (!isFinite(minD) || minD < 0) err.textContent = 'Некоректна мінімальна відстань';
        else A.saveProfile({
          id: S.editing.id, name, pricePerKm: km, pricePerIdleMinute: idle,
          minPrice: min, minDistanceKm: minD
        });
        break;
      }
    }
  });

  /* Ввод расстояния и ожидания. Перерисовывать экран нельзя — поле
     потеряло бы фокус, поэтому обновляются только сумма и расчёт. */
  screenEl.addEventListener('input', e => {
    const el = e.target;
    if (el.id !== 'cDist' && el.id !== 'cIdle') return;

    const decimal = el.id === 'cDist';
    let cleaned = el.value.replace(',', '.').replace(decimal ? /[^\d.]/g : /[^\d]/g, '');
    if (decimal) {
      // Точку допускаем только одну: «12.4.5» ничего не значит
      const first = cleaned.indexOf('.');
      if (first >= 0) {
        cleaned = cleaned.slice(0, first + 1) + cleaned.slice(first + 1).replace(/\./g, '');
      }
    }
    if (cleaned !== el.value) el.value = cleaned;

    if (decimal) S.calc.distanceText = cleaned; else S.calc.idleText = cleaned;
    syncLastTrip();
    paintLive();
  });

  render();
  requestAnimationFrame(tick);

</script>
