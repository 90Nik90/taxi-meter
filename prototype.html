<title>Калькулятор таксиста</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    color-scheme: light;

    /* Фон страницы вокруг телефона */
    --page-bg: #ecebe6;

    /* Экран устройства: значения один-в-один из ui/theme/Theme.kt */
    --m-bg: #101418;
    --m-surface: #1b222b;
    --m-variant: #243040;
    --m-on: #e6eaf0;
    --m-dim: #b4bfce;
    --m-outline: #3a4757;
    --m-accent: #ffd426;
    --m-go: #2ecc71;
    --m-wait: #ffa726;
    --m-stop: #e74c3c;
    --m-gray: #6b7889;
    /* Безналичная оплата: отделяет карту от жёлтого фирменного цвета */
    --m-card: #3f9bf0;

    --shell: #04060a;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page-bg: #14181d;
      --shell: #000000;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --page-bg: #14181d;
    --shell: #000000;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--m-on);
    font-family: Roboto, "Segoe UI", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ─── Корпус телефона ────────────────────────────────────────── */

  .phone {
    width: 100%;
    max-width: 392px;
    background: var(--shell);
    border-radius: 34px;
    padding: 9px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, .32), 0 1px 0 rgba(255, 255, 255, .06) inset;
  }

  .screen {
    background: var(--m-bg);
    color: var(--m-on);
    border-radius: 26px;
    overflow: hidden;
    height: min(748px, calc(100dvh - 58px));
    min-height: 560px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 18px 3px;
    font-family: "Roboto Mono", monospace;
    font-size: 11px;
    color: var(--m-dim);
    flex: none;
  }

  .appbar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 6px 4px 8px;
    flex: none;
  }

  .appbar .t {
    flex: 1;
    font-size: 20px;
    font-weight: 500;
    padding-left: 8px;
  }

  .iconbtn {
    width: 44px;
    height: 44px;
    border: 0;
    background: none;
    border-radius: 50%;
    color: var(--m-on);
    display: grid;
    place-items: center;
    cursor: pointer;
    flex: none;
    padding: 0;
  }

  .iconbtn:hover { background: rgba(255, 255, 255, .07); }
  .iconbtn:focus-visible { outline: 2px solid var(--m-accent); outline-offset: -3px; }
  .iconbtn svg { width: 22px; height: 22px; fill: currentColor; }

  .body-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
  }

  .card {
    background: var(--m-surface);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Вся карточка профиля — кнопка выбора тарифа */
  .card.tap { cursor: pointer; border: 1px solid var(--m-outline); }
  .card.tap:hover { background: #1f2731; border-color: var(--m-dim); }
  .card.tap:active { background: #263040; }
  .card.tap.sel { border-color: var(--m-go); }

  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }


  .label {
    font-size: 11px;
    letter-spacing: .09em;
    color: var(--m-dim);
    font-weight: 700;
  }

  .small { font-size: 12px; color: var(--m-dim); }
  .mono { font-family: "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }

  .kv {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 14px;
  }

  .kv span:first-child { color: var(--m-dim); }
  .kv span:last-child { font-family: "Roboto Mono", monospace; font-weight: 500; font-variant-numeric: tabular-nums; }

  /* Поле-селектор профиля: имитация OutlinedTextField */

  /* Название тарифа над расчётом; нажатие ведёт к выбору тарифа */
  .profile-name {
    text-align: center;
    font-size: 17px;
    font-weight: 500;
    color: var(--m-on);
    padding-top: 4px;
    cursor: pointer;
  }

  .profile-sub { text-align: center; font-size: 12px; color: var(--m-dim); cursor: pointer; }

  .odometer { text-align: center; }

  .odometer .big {
    font-family: "Roboto Mono", monospace;
    font-weight: 700;
    font-size: 58px;
    line-height: 1;
    color: var(--m-accent);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .odometer .unit { color: var(--m-dim); font-size: 16px; margin-left: 8px; }

  /* Дополнительные услуги: галочку поставить — убрать */
  .service {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 0;
    cursor: pointer;
    font-size: 16px;
  }

  .service:hover .checkbox { border-color: var(--m-dim); }

  .checkbox {
    width: 20px;
    height: 20px;
    border-radius: 3px;
    border: 2px solid var(--m-dim);
    flex: none;
    display: grid;
    place-items: center;
    transition: background .12s, border-color .12s;
  }

  .checkbox.on { background: var(--m-accent); border-color: var(--m-accent); }
  .checkbox svg { width: 16px; height: 16px; fill: #101418; }

  /* Кнопка сохранения: обычной высоты и спокойного цвета */
  .savebtn {
    flex: none;
    height: 52px;
    border: 0;
    border-radius: 14px;
    background: var(--m-variant);
    color: var(--m-on);
    font-family: Roboto, sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .savebtn:hover { background: #2c3849; }
  .savebtn:active { transform: translateY(1px); }

  .fab {
    position: absolute;
    right: 18px;
    bottom: 18px;
    width: 56px;
    height: 56px;
    border-radius: 18px;
    border: 0;
    background: var(--m-accent);
    color: #101418;
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .4);
  }

  .fab svg { width: 24px; height: 24px; fill: currentColor; }

  .textbtn {
    background: none;
    border: 0;
    color: var(--m-accent);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .textbtn:hover { background: rgba(255, 212, 38, .1); }

  .minput {
    width: 100%;
    background: none;
    border: 1px solid var(--m-outline);
    border-radius: 6px;
    color: var(--m-on);
    font-family: "Roboto Mono", monospace;
    font-size: 16px;
    padding: 12px 14px;
  }

  .minput:focus { outline: none; border-color: var(--m-accent); }
  .mfield { position: relative; }

  /* Поля калькулятора: крупные цифры и единица справа внутри рамки */
  .minput.big { font-size: 22px; font-weight: 700; padding: 14px 52px 14px 14px; }
  .minput:disabled { color: var(--m-accent); opacity: 1; }

  /* Кнопки счётчика под полями */
  .meterrow { display: flex; gap: 10px; }

  .meterbtn {
    flex: 1;
    height: 56px;
    border: 0;
    border-radius: 18px;
    color: #101418;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
  }

  .meterbtn:active { transform: translateY(1px); }

  /* Полоса о потере сигнала */
  .warnbar {
    display: flex;
    align-items: center;
    margin: 4px 16px;
    padding: 10px 12px;
    border-radius: 12px;
    background: color-mix(in srgb, var(--m-wait) 16%, transparent);
    color: var(--m-wait);
    font-size: 12px;
    flex: none;
  }

  /* Переключатель в настройках */
  .switch {
    width: 46px;
    height: 26px;
    border-radius: 13px;
    background: var(--m-variant);
    border: 1px solid var(--m-outline);
    flex: none;
    display: flex;
    align-items: center;
    padding: 2px;
    transition: background .15s;
  }

  .switch .knob {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--m-dim);
    transition: transform .15s, background .15s;
  }

  .switch.on { background: var(--m-go); border-color: var(--m-go); }
  .switch.on .knob { transform: translateX(20px); background: #101418; }

  .mfield .funit {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: var(--m-dim);
    pointer-events: none;
  }

  /* Единственная кнопка калькулятора — сброс под следующего клиента */
  .ctrl-col { display: grid; padding: 12px 16px; flex: none; }

  .resetbtn {
    width: 100%;
    height: 56px;
    background: var(--m-variant);
    border: 0;
    border-radius: 18px;
    color: var(--m-on);
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
  }

  .resetbtn:disabled { opacity: .4; cursor: default; }
  .resetbtn:not(:disabled):hover { background: #2c3849; }
  .resetbtn:not(:disabled):active { transform: translateY(1px); }

  .mfield .flabel {
    position: absolute;
    top: -8px;
    left: 11px;
    background: var(--m-bg);
    padding: 0 5px;
    font-size: 11px;
    color: var(--m-dim);
    pointer-events: none;
  }

  /* AlertDialog подтверждения — как в ProfilesScreen.kt */
  .scrim {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, .62);
    display: grid;
    place-items: center;
    padding: 24px;
    z-index: 5;
  }

  .dialog {
    background: #232b36;
    border-radius: 28px;
    padding: 24px;
    width: 100%;
    max-width: 300px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .dialog h3 { margin: 0; font-size: 22px; font-weight: 400; color: var(--m-on); }
  .dialog .dtext { font-size: 14px; color: var(--m-dim); }
  .dialog .dactions { display: flex; justify-content: flex-end; gap: 4px; margin-top: 10px; }
  hr { border: 0; border-top: 1px solid var(--m-outline); margin: 2px 0; width: 100%; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="phone">
  <div class="screen" id="screen">
    <div class="statusbar">
      <span id="sbClock">14:32</span>
      <span>▮▮▮ 78%</span>
    </div>
    <div id="screenBody" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
    <div id="dialogHost"></div>
  </div>
</div>

<script>
  "use strict";

  /* ═══ Иконки Material, те же, что в приложении ═══ */
  const ICON = {
    back: 'M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z',
    add: 'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z',
    del: 'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z',
    check: 'M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',
    settings: 'M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z'
  };
  const svg = (name, cls) =>
    `<svg viewBox="0 0 24 24"${cls ? ` class="${cls}"` : ''} aria-hidden="true"><path d="${ICON[name]}"/></svg>`;

  /* ═══ Хранилище ═══ */
  const LS = 'taxi-proto-v1';
  const defaults = () => ([
    { id: 'p1', name: 'Місто', pricePerKm: 15, pricePerIdleMinute: 2, minPrice: 60, minDistanceKm: 2 },
    { id: 'p2', name: 'Нічний', pricePerKm: 20, pricePerIdleMinute: 3, minPrice: 90, minDistanceKm: 2 }
  ]);

  /* data/Profile.kt → ExtraService; цены общие для всех тарифов */
  const SERVICES = [
    { key: 'CHILDREN', title: 'Діти', field: 'children' },
    { key: 'PETS', title: 'Тварини', field: 'pets' },
    { key: 'LUGGAGE', title: 'Багаж у салоні', field: 'luggage' }
  ];

  const defaultServicePrices = () => ({ children: 20, pets: 30, luggage: 20 });

  function load() {
    try {
      const raw = localStorage.getItem(LS);
      if (!raw) return null;
      const v = JSON.parse(raw);
      if (!v || !Array.isArray(v.profiles) || !v.profiles.length) return null;
      // Сохранения до выноса услуг в общие настройки
      if (!v.servicePrices) v.servicePrices = defaultServicePrices();
      SERVICES.forEach(s => {
        if (typeof v.servicePrices[s.field] !== 'number') v.servicePrices[s.field] = 0;
      });
      return v;
    } catch (e) { return null; }
  }

  function save() {
    try {
      localStorage.setItem(LS, JSON.stringify({
        v: 7,
        profiles: S.profiles,
        activeId: S.activeId,
        gpsEnabled: S.gpsEnabled,
        servicePrices: S.servicePrices
      }));
    } catch (e) { /* приватное окно — работаем без сохранения */ }
  }

  const stored = load();

  const S = {
    /* Стек экранов: «назад» всегда возвращает туда, откуда пришли */
    stack: ['calc'],
    profiles: stored ? stored.profiles : defaults(),
    activeId: stored ? stored.activeId : 'p1',
    editing: null,
    pendingDelete: null,
    /* Доплати общие для всех тарифов */
    servicePrices: stored ? stored.servicePrices : defaultServicePrices(),
    /* AppSettings.gpsEnabled — галочка «лічильник по GPS» */
    gpsEnabled: stored ? !!stored.gpsEnabled : false,
    /* meter/DistanceMeter.kt — состояние счётчика */
    meter: { state: 'IDLE', km: 0, idleMs: 0, speed: 0, hasFix: true },
    /* data/CalcInput.kt — что водитель ввёл в калькуляторе */
    calc: { distanceText: '', idleText: '', services: [] }
  };

  /* Имена профилей вводит пользователь — экранируем перед вставкой в разметку */
  const esc = s => String(s === null || s === undefined ? '' : s).replace(
    /[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
  );

  const screenName = () => S.stack[S.stack.length - 1];
  const activeProfile = () => S.profiles.find(p => p.id === S.activeId) || S.profiles[0] || null;

  /* ═══ Арифметика — перенос из data/Profile.kt ═══ */
  const round2 = v => Math.round(v * 100) / 100;
  const fmt = (v, d) => (v === null || v === undefined || !isFinite(v) ? '—' : v.toFixed(d === undefined ? 2 : d));

  /* Округление вверх с запасом на погрешность double: ровно 2 км
     не должны открывать третий километр. */
  const ceilUnits = v => Math.max(0, Math.ceil(v - 1e-9));

  function calculateFare(p, distanceKm, idleSeconds, services, servicePrices) {
    if (!p) return null;
    const km = Math.max(0, distanceKm);

    // Каждая начатая минута простоя оплачивается целиком
    const billedIdleMinutes = ceilUnits(Math.max(0, idleSeconds) / 60);
    const idlePart = billedIdleMinutes * p.pricePerIdleMinute;

    // Каждый начатый километр сверх минимального расстояния — целиком
    const billedKm = ceilUnits(km - p.minDistanceKm);

    // Доплати за послуги прибавляются к минимальной цене поездки
    const prices = servicePrices || defaultServicePrices();
    const servicesPart = (services || []).reduce((sum, key) => {
      const s = SERVICES.find(x => x.key === key);
      return sum + (s ? (prices[s.field] || 0) : 0);
    }, 0);
    const effectiveMinPrice = p.minPrice + servicesPart;

    let distancePart, minApplied;
    if (p.minDistanceKm > 0) {
      distancePart = effectiveMinPrice + billedKm * p.pricePerKm;
      minApplied = billedKm === 0;
    } else {
      const raw = billedKm * p.pricePerKm;
      if (raw < effectiveMinPrice) { distancePart = effectiveMinPrice; minApplied = true; }
      else { distancePart = raw; minApplied = false; }
    }

    return {
      distanceKm: km, billedKm, billedIdleMinutes,
      distancePart: round2(distancePart),
      servicesPart: round2(servicesPart),
      idlePart: round2(idlePart),
      total: round2(distancePart + idlePart),
      minPriceApplied: minApplied
    };
  }

  /* ═══ data/CalcInput.kt ═══ */
  /** Введённое расстояние; запятая с клавиатуры считается точкой. */
  const calcKm = () => {
    const v = parseFloat(String(S.calc.distanceText).replace(',', '.'));
    return isFinite(v) && v > 0 ? v : 0;
  };

  /** Ожидание вводится целыми минутами, поэтому округлять нечего. */
  const calcMinutes = () => {
    const v = parseInt(S.calc.idleText, 10);
    return isFinite(v) && v > 0 ? v : 0;
  };

  const calcEmpty = () =>
    calcKm() <= 0 && calcMinutes() === 0 && !S.calc.services.length;

  const fare = () =>
    calculateFare(activeProfile(), calcKm(), calcMinutes() * 60, S.calc.services, S.servicePrices);

  /* ═══ meter/DistanceMeter.kt — имитация счётчика ═══ */

  /* В прототипе спутников нет, поэтому едем с постоянной скоростью */
  const DEMO_SPEED_KMH = 60;

  const meterMinutes = () => Math.max(0, Math.ceil(S.meter.idleMs / 60000 - 1e-9));

  /** Живые показания счётчика видны прямо в полях калькулятора. */
  function meterToCalc() {
    S.calc.distanceText = S.meter.km.toFixed(2);
    const m = meterMinutes();
    S.calc.idleText = m > 0 ? String(m) : '';
  }

  let lastReal = performance.now();

  function tick(now) {
    const dt = Math.min(400, now - lastReal);
    lastReal = now;

    if (S.meter.state === 'RUNNING') {
      S.meter.speed = DEMO_SPEED_KMH;
      S.meter.km += DEMO_SPEED_KMH * (dt / 3600000);
      meterToCalc();
    } else if (S.meter.state === 'PAUSED') {
      S.meter.speed = 0;
      S.meter.idleMs += dt;
      meterToCalc();
    }

    paintLive();
    requestAnimationFrame(tick);
  }

  /* ═══ Действия ═══ */
  const A = {
    resetCalc() {
      S.meter = { state: 'IDLE', km: 0, idleMs: 0, speed: 0, hasFix: true };
      S.calc = { distanceText: '', idleText: '', services: [] };
      render();
    },

    toggleGps() {
      S.gpsEnabled = !S.gpsEnabled;
      if (!S.gpsEnabled) S.meter.state = 'IDLE';
      save();
      render();
    },

    startMeter() {
      S.meter = { state: 'RUNNING', km: 0, idleMs: 0, speed: DEMO_SPEED_KMH, hasFix: true };
      meterToCalc();
      render();
    },

    pauseMeter() { S.meter.state = 'PAUSED'; render(); },
    resumeMeter() { S.meter.state = 'RUNNING'; render(); },

    /* Стоп: итог остаётся в полях калькулятора и правится руками */
    stopMeter() {
      S.meter.state = 'IDLE';
      S.meter.speed = 0;
      meterToCalc();
      render();
    },

    toggleService(key) {
      S.calc.services = S.calc.services.includes(key)
        ? S.calc.services.filter(k => k !== key)
        : S.calc.services.concat(key);
      render();
    },

    go(next) { S.stack = S.stack.concat(next); render(); },
    back() { if (S.stack.length > 1) S.stack = S.stack.slice(0, -1); render(); },

    /* Вибір тарифу сразу возвращает к расчёту */
    selectProfile(id) { S.activeId = id; S.stack = ['calc']; save(); render(); },

    saveProfile(p) {
      const i = S.profiles.findIndex(x => x.id === p.id);
      if (i >= 0) S.profiles[i] = p; else S.profiles.push(p);
      S.editing = null; if (S.stack.length > 1) S.stack = S.stack.slice(0, -1); save(); render();
    },

    askDelete(id) { S.pendingDelete = id; render(); },
    cancelDelete() { S.pendingDelete = null; render(); },

    confirmDelete() {
      const id = S.pendingDelete;
      S.pendingDelete = null;
      S.profiles = S.profiles.filter(p => p.id !== id);
      if (!S.profiles.length) S.profiles = defaults();
      if (!S.profiles.some(p => p.id === S.activeId)) S.activeId = S.profiles[0].id;
      save(); render();
    },
  };

  /* ═══ Отрисовка ═══ */
  function appbar(title, showBack, actions) {
    return `<div class="appbar">
      ${showBack ? `<button class="iconbtn" data-act="back" aria-label="Назад">${svg('back')}</button>` : ''}
      <div class="t">${title}</div>${actions || ''}</div>`;
  }

  /* ui/SettingsScreen.kt */
  function settingsScreen() {
    const row = (title, subtitle, target) => `<div class="card tap" data-act="go" data-arg="${target}">
      <div class="row">
        <div class="grow">
          <div style="font-size:17px;font-weight:500">${title}</div>
          <div class="small">${subtitle}</div>
        </div>
        <span style="color:var(--m-dim);font-size:20px">&rsaquo;</span>
      </div>
    </div>`;

    const toggle = `<div class="card tap" data-act="toggleGps">
      <div class="row">
        <div class="grow">
          <div style="font-size:17px;font-weight:500">Лічильник по GPS</div>
          <div class="small">Відстань рахується сама під час поїздки —
            на калькуляторі з’являються «Почати відлік» і «Стоп»</div>
        </div>
        <span class="switch${S.gpsEnabled ? ' on' : ''}"><span class="knob"></span></span>
      </div>
    </div>`;

    return appbar('Налаштування', true)
      + `<div class="body-scroll">
        ${toggle}
        ${row('Тарифи', 'Ціна за км, простій, мінімальна ціна', 'profiles')}
        ${row('Доплати за послуги', 'Діти, тварини, багаж у салоні', 'servicePrices')}
      </div>`;
  }

  /**
   * ui/CalculatorScreen.kt — расстояние водитель узнаёт сам и вводит здесь,
   * приложение считает стоимость по выбранному тарифу.
   */
  function calcScreen() {
    const p = activeProfile();
    const c = S.calc;
    const st = S.meter.state;

    // Пока счётчик работает, поля заполняет он: руками их не трогаем,
    // иначе набранное затрётся следующей выборкой.
    const locked = S.gpsEnabled && st !== 'IDLE';

    const field = (id, label, unit, val, big) => `<div class="mfield">
      <span class="flabel">${label}</span>
      <input class="minput${big ? ' big' : ''}" id="${id}" value="${esc(val)}" inputmode="decimal"
        autocomplete="off"${locked ? ' disabled' : ''}>
      <span class="funit">${unit}</span>
    </div>`;

    const warn = (locked && !S.meter.hasFix)
      ? '<div class="warnbar">Немає сигналу GPS — кілометри не рахуються</div>' : '';

    return `<div class="appbar">
      <div class="t"></div>
      <button class="iconbtn" data-act="go" data-arg="settings" aria-label="Налаштування">${svg('settings')}</button>
    </div>` + warn
      + `<div class="body-scroll" style="gap:14px">
        <div>
          <div class="profile-name" data-act="go" data-arg="profiles">${
            p ? esc(p.name) : 'Немає тарифів'}</div>
          ${p ? `<div class="profile-sub" data-act="go" data-arg="profiles">${
            fmt(p.pricePerKm)} грн/км · мін. ${fmt(p.minPrice)} грн до ${
            fmt(p.minDistanceKm, 1)} км</div>` : ''}
        </div>

        <div class="card odometer">
          <div class="label">ДО СПЛАТИ</div>
          <div><span class="big" id="cTotal">0.00</span><span class="unit">грн</span></div>
        </div>

        ${field('cDist', 'Відстань', 'км', c.distanceText, true)}
        ${field('cIdle', 'Очікування', 'хв', c.idleText, true)}

        ${S.gpsEnabled ? meterControls(st) : ''}

        <div class="card">
          <div class="label">ДОДАТКОВІ ПОСЛУГИ</div>
          ${SERVICES.map(s => {
            const on = c.services.includes(s.key);
            return `<div class="service" data-act="toggleService" data-arg="${s.key}">
              <span class="checkbox${on ? ' on' : ''}">${on ? svg('check') : ''}</span>
              <span class="grow">${s.title}</span>
              <span class="mono" style="font-size:13px;color:${on ? 'var(--m-accent)' : 'var(--m-dim)'}">
                +${fmt(S.servicePrices[s.field] || 0)} грн</span>
            </div>`;
          }).join('')}
        </div>

        <div style="height:4px"></div>
      </div>

      <div class="ctrl-col">
        <button class="resetbtn big" data-act="resetCalc"${
          (calcEmpty() && S.meter.state === 'IDLE') ? ' disabled' : ''}>СКИНУТИ</button>
      </div>`;
  }

  /**
   * Кнопки счётчика. В покое одна широкая «Почати відлік», в работе —
   * очікування и стоп, на паузе — поїхали и стоп.
   */
  function meterControls(state) {
    const btn = (text, color, act) =>
      `<button class="meterbtn" style="background:${color}" data-act="${act}">${text}</button>`;

    const row = state === 'IDLE'
      ? btn('ПОЧАТИ ВІДЛІК', 'var(--m-go)', 'startMeter')
      : state === 'RUNNING'
        ? btn('ОЧІКУВАННЯ', 'var(--m-wait)', 'pauseMeter') + btn('СТОП', 'var(--m-stop)', 'stopMeter')
        : btn('ПОЇХАЛИ', 'var(--m-go)', 'resumeMeter') + btn('СТОП', 'var(--m-stop)', 'stopMeter');

    return `<div style="display:grid;gap:6px">
      <div class="meterrow">${row}</div>
      ${state === 'RUNNING'
        ? '<div class="small mono" style="text-align:center" id="cSpeed">0 км/год</div>' : ''}
    </div>`;
  }

  /**
   * Один экран в двух режимах: из калькулятора — только выбор тарифа,
   * из настроек — ещё создание, правка и удаление.
   */
  function profilesScreen() {
    // Карточка — кнопка выбора тарифа; шестерёнка и корзина внутри
    // перехватывают нажатие на себя.
    return appbar('Тарифи', true)
      + `<div class="body-scroll">
        ${S.profiles.map(p => `
          <div class="card tap ${p.id === S.activeId ? 'sel' : ''}" data-act="selectProfile" data-arg="${p.id}">
            <div class="row">
              ${p.id === S.activeId ? `<span style="color:var(--m-go);display:grid;place-items:center">${svg('check')}</span>` : ''}
              <span class="grow" style="font-size:17px;font-weight:500">${esc(p.name)}</span>
              <button class="iconbtn" data-act="edit" data-arg="${p.id}" aria-label="Налаштувати тариф"
                style="color:var(--m-dim);width:38px;height:38px">${svg('settings')}</button>
              <button class="iconbtn" data-act="del" data-arg="${p.id}" aria-label="Видалити тариф"
                style="color:var(--m-stop);width:38px;height:38px">${svg('del')}</button>
            </div>
            <div class="kv"><span>Вартість 1 км</span><span>${fmt(p.pricePerKm)} грн</span></div>
            <div class="kv"><span>Простій</span><span>${fmt(p.pricePerIdleMinute)} грн/хв</span></div>
            <div class="kv"><span>Мінімальна ціна</span><span>${fmt(p.minPrice)} грн</span></div>
            <div class="kv"><span>Мінімальна відстань</span><span>${fmt(p.minDistanceKm, 1)} км</span></div>
          </div>`).join('')}

        <div style="height:70px"></div>
      </div>
      <button class="fab" data-act="edit" data-arg="new" aria-label="Додати тариф">${svg('add')}</button>`;
  }

  function editScreen() {
    const p = S.editing;
    const f = (id, label, val, mode) => `<div class="mfield"><span class="flabel">${label}</span>
      <input class="minput" id="${id}" value="${val}" ${mode ? 'inputmode="decimal"' : ''}></div>`;
    return appbar('Налаштування тарифу', true)
      + `<div class="body-scroll" style="gap:18px;padding-top:10px">
        <div class="mfield"><span class="flabel">Назва тарифу</span>
          <input class="minput" id="eName" value="${esc(p.name)}" style="font-family:Roboto,sans-serif"></div>
        ${f('eKm', 'Вартість 1 км, грн', fmt(p.pricePerKm), 1)}
        ${f('eIdle', 'Вартість простою, грн/хв', fmt(p.pricePerIdleMinute), 1)}
        ${f('eMin', 'Мінімальна ціна за поїздку, грн', fmt(p.minPrice), 1)}
        ${f('eMinD', 'Мін. відстань для мін. ціни, км', fmt(p.minDistanceKm, 1), 1)}
        <div class="small" id="eErr" style="color:var(--m-stop)"></div>
        <button class="savebtn" data-act="saveProfile">Зберегти</button>
      </div>`;
  }

  /* ui/ProfilesScreen.kt → ServicePricesScreen */
  function servicePricesScreen() {
    const sp = S.servicePrices;
    const f = (id, label, val) => `<div class="mfield"><span class="flabel">${label}</span>
      <input class="minput" id="${id}" value="${val}" inputmode="decimal"></div>`;
    return appbar('Доплати за послуги', true)
      + `<div class="body-scroll" style="gap:18px;padding-top:10px">
        <div class="small">Діють на всіх тарифах. Увімкнена послуга додає свою ціну
          до мінімальної вартості поїздки.</div>
        ${f('sChildren', 'Діти, грн', fmt(sp.children || 0))}
        ${f('sPets', 'Тварини, грн', fmt(sp.pets || 0))}
        ${f('sLuggage', 'Багаж у салоні, грн', fmt(sp.luggage || 0))}
        <div class="small" id="sErr" style="color:var(--m-stop)"></div>
        <button class="savebtn" data-act="saveServicePrices">Зберегти</button>
      </div>`;
  }

  function render() {
    const host = document.getElementById('screenBody');

    /* Перестроение разметки сбрасывает прокрутку наверх: галочка услуги
       отбрасывала бы к началу экрана. */
    const prev = host.querySelector('.body-scroll');
    const keepScroll = prev && renderedScreen === screenName() ? prev.scrollTop : 0;
    renderedScreen = screenName();

    host.innerHTML = {
      calc: calcScreen,
      settings: settingsScreen,
      profiles: profilesScreen,
      edit: editScreen,
      servicePrices: servicePricesScreen,
    }[screenName()]();

    const dlg = document.getElementById('dialogHost');
    const target = S.pendingDelete ? S.profiles.find(p => p.id === S.pendingDelete) : null;

    if (target) {
      dlg.innerHTML = `<div class="scrim" data-act="cancelDelete">
           <div class="dialog" data-act="noop">
             <h3>Видалити тариф?</h3>
             <div class="dtext">${esc(target.name)}</div>
             <div class="dactions">
               <button class="textbtn" data-act="cancelDelete">Скасувати</button>
               <button class="textbtn" data-act="confirmDelete">Видалити</button>
             </div>
           </div>
         </div>`;
    } else {
      dlg.innerHTML = '';
    }

    if (keepScroll) {
      const next = host.querySelector('.body-scroll');
      if (next) next.scrollTop = keepScroll;
    }

    paintLive();
  }

  /** Какой экран сейчас отрисован — чтобы не переносить прокрутку чужому. */
  let renderedScreen = null;

  /* Значения, обновляемые без перестроения разметки: ввод не должен
     терять фокус и каретку на каждом нажатии клавиши */
  function paintLive() {
    const set = (id, txt) => { const el = document.getElementById(id); if (el && el.textContent !== txt) el.textContent = txt; };

    if (screenName() === 'calc') {
      const f = fare();
      set('cTotal', fmt(f ? f.total : 0));

      // Пока счётчик работает, он и заполняет поля
      if (S.meter.state !== 'IDLE') {
        const dist = document.getElementById('cDist');
        const idle = document.getElementById('cIdle');
        if (dist && dist.value !== S.calc.distanceText) dist.value = S.calc.distanceText;
        if (idle && idle.value !== S.calc.idleText) idle.value = S.calc.idleText;
        set('cSpeed', `${Math.round(S.meter.speed)} км/год`);
      }

      const reset = document.querySelector('.resetbtn');
      if (reset) reset.disabled = calcEmpty() && S.meter.state === 'IDLE';
    }

    const now = new Date();
    set('sbClock', `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);
  }

  /* ═══ События ═══ */
  const screenEl = document.getElementById('screen');

  /* Делегирование: closest() находит ближайший [data-act], поэтому кнопка
     внутри карточки профиля перехватывает клик у самой карточки. */
  screenEl.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act, arg = el.dataset.arg;

    switch (act) {
      case 'resetCalc': A.resetCalc(); break;
      case 'toggleGps': A.toggleGps(); break;
      case 'startMeter': A.startMeter(); break;
      case 'pauseMeter': A.pauseMeter(); break;
      case 'resumeMeter': A.resumeMeter(); break;
      case 'stopMeter': A.stopMeter(); break;
      case 'toggleService': A.toggleService(arg); break;
      case 'go': A.go(arg); break;
      case 'back': A.back(); break;
      case 'selectProfile': A.selectProfile(arg); break;
      case 'edit': {
        S.editing = arg === 'new'
          ? { id: 'p' + Date.now(), name: 'Новий тариф', pricePerKm: 15, pricePerIdleMinute: 2, minPrice: 60, minDistanceKm: 2 }
          : Object.assign({}, S.profiles.find(p => p.id === arg));
        S.stack = S.stack.concat('edit');
        render();
        break;
      }
      case 'del': A.askDelete(arg); break;
      case 'confirmDelete': A.confirmDelete(); break;
      case 'cancelDelete': A.cancelDelete(); break;
      case 'saveServicePrices': {
        const val = id => parseFloat((document.getElementById(id).value || '').replace(',', '.'));
        const ch = val('sChildren'), pe = val('sPets'), lu = val('sLuggage');
        const err = document.getElementById('sErr');
        if (!isFinite(ch) || ch < 0) err.textContent = 'Некоректна доплата за дітей';
        else if (!isFinite(pe) || pe < 0) err.textContent = 'Некоректна доплата за тварин';
        else if (!isFinite(lu) || lu < 0) err.textContent = 'Некоректна доплата за багаж';
        else {
          S.servicePrices = { children: ch, pets: pe, luggage: lu };
          S.stack = S.stack.slice(0, -1);
          save();
          render();
        }
        break;
      }
      case 'saveProfile': {
        const val = id => parseFloat((document.getElementById(id).value || '').replace(',', '.'));
        const name = document.getElementById('eName').value.trim();
        const km = val('eKm'), idle = val('eIdle'), min = val('eMin'), minD = val('eMinD');
        const err = document.getElementById('eErr');
        if (!name) err.textContent = 'Вкажіть назву тарифу';
        else if (!isFinite(km) || km < 0) err.textContent = 'Некоректна вартість за км';
        else if (!isFinite(idle) || idle < 0) err.textContent = 'Некоректна вартість простою';
        else if (!isFinite(min) || min < 0) err.textContent = 'Некоректна мінімальна ціна';
        else if (!isFinite(minD) || minD < 0) err.textContent = 'Некоректна мінімальна відстань';
        else A.saveProfile({
          id: S.editing.id, name, pricePerKm: km, pricePerIdleMinute: idle,
          minPrice: min, minDistanceKm: minD
        });
        break;
      }
    }
  });

  /* Ввод расстояния и ожидания. Перерисовывать экран нельзя — поле
     потеряло бы фокус, поэтому обновляются только сумма и расчёт. */
  screenEl.addEventListener('input', e => {
    const el = e.target;
    if (el.id !== 'cDist' && el.id !== 'cIdle') return;

    const decimal = el.id === 'cDist';
    let cleaned = el.value.replace(',', '.').replace(decimal ? /[^\d.]/g : /[^\d]/g, '');
    if (decimal) {
      // Точку допускаем только одну: «12.4.5» ничего не значит
      const first = cleaned.indexOf('.');
      if (first >= 0) {
        cleaned = cleaned.slice(0, first + 1) + cleaned.slice(first + 1).replace(/\./g, '');
      }
    }
    if (cleaned !== el.value) el.value = cleaned;

    if (decimal) S.calc.distanceText = cleaned; else S.calc.idleText = cleaned;
    paintLive();
  });

  render();
  requestAnimationFrame(tick);

</script>
